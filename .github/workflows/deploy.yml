name: Deploy to ConoHa VPS

on:
  push:
    branches:
      - main # mainブランチへのマージ時のみデプロイ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }} # secrets.HOST -> SERVER_HOST
          username: ${{ secrets.SERVER_USER }} # secrets.USERNAME -> SERVER_USER
          key: ${{ secrets.SSH_PRIVATE_KEY }} # そのまま
          port: 22
          script: |
            # 1. アプリケーションディレクトリへ移動
            cd /opt/prompt-provision-tool

            # 2. 最新のコードを強制的に取得 (Reset -> Pull)
            # ※ 注意: サーバー上の未コミット変更は消えます
            git fetch origin
            git reset --hard origin/main

            # 3. 仮想環境のアクティベート
            source venv/bin/activate

            # 4. 依存パッケージの更新
            pip install -r backend/requirements.txt

            # 5. DBマイグレーション実行
            cd backend
            alembic upgrade head

            # 6. サービスの再起動（権限が必要なためsudoを使用）
            # sudoersでパスワードなし許可設定が必要な場合があります
            echo "Restarting services..."
            sudo systemctl restart prompt-tool
            sudo systemctl restart prompt-tool-celery
            sudo systemctl restart nginx

            echo "Deployment Finished!"
