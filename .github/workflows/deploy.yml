name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        run: |
          # デプロイ先ディレクトリ
          APP_DIR="/opt/prompt-provision-tool"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.SERVER_HOST }}"

          # rsyncでファイルをアップロード（.envやローカルファイルを除外）
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.*' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='*.swp' \
            --exclude='*.swo' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='backend/uploads/' \
            --exclude='backend/temp/' \
            --exclude='frontend/uploads/' \
            --exclude='docker-compose.local.yml' \
            --exclude='資料/' \
            ./ $SERVER_USER@$SERVER_HOST:$APP_DIR/

      - name: Run database migrations
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/prompt-provision-tool/backend
            source /opt/prompt-provision-tool/venv/bin/activate
            alembic upgrade head
          EOF

      - name: Install/update Python dependencies
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /opt/prompt-provision-tool/backend
            source /opt/prompt-provision-tool/venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          EOF

      - name: Update systemd service files
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            # systemdサービスファイルを更新
            if [ -f /opt/prompt-provision-tool/deployment/prompt-tool.service ]; then
              sudo cp /opt/prompt-provision-tool/deployment/prompt-tool.service /etc/systemd/system/
            fi
            if [ -f /opt/prompt-provision-tool/deployment/prompt-tool-celery.service ]; then
              sudo cp /opt/prompt-provision-tool/deployment/prompt-tool-celery.service /etc/systemd/system/
            fi
            sudo systemctl daemon-reload
          EOF

      - name: Restart application services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            sudo systemctl restart prompt-tool.service
            sudo systemctl restart prompt-tool-celery.service
            sleep 5
            # サービス状態を確認
            if ! sudo systemctl is-active --quiet prompt-tool.service; then
              echo "Error: prompt-tool.service is not active"
              sudo systemctl status prompt-tool.service --no-pager
              exit 1
            fi
            if ! sudo systemctl is-active --quiet prompt-tool-celery.service; then
              echo "Error: prompt-tool-celery.service is not active"
              sudo systemctl status prompt-tool-celery.service --no-pager
              exit 1
            fi
            echo "All services are active"
            sudo systemctl status prompt-tool.service --no-pager | head -20
            sudo systemctl status prompt-tool-celery.service --no-pager | head -20
          EOF

      - name: Verify deployment
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            # ヘルスチェック
            echo "Checking application health..."
            for i in {1..5}; do
              if curl -f http://127.0.0.1:8000/health; then
                echo "Health check passed"
                break
              else
                if [ $i -eq 5 ]; then
                  echo "Health check failed after 5 attempts"
                  exit 1
                fi
                echo "Health check failed, retrying in 5 seconds..."
                sleep 5
              fi
            done
            
            # Redis接続確認
            echo "Checking Redis connection..."
            if redis-cli ping > /dev/null 2>&1; then
              echo "Redis is running"
            else
              echo "Warning: Redis connection check failed"
            fi
          EOF

