# ============================================================
# 本番環境（ConoHaVPS）用 Nginx 設定
# IPアドレスでの接続用（SSLなし）
# ============================================================

# upstream設定（FastAPIアプリケーション）
upstream fastapi_backend {
    server 127.0.0.1:8000;
}

# HTTPサーバー
server {
    listen 80;
    server_name 160.251.184.178;  # ConoHa VPS IP

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ログ設定
    access_log /var/log/nginx/prompt-tool-access.log;
    error_log /var/log/nginx/prompt-tool-error.log;

    # 静的ファイル（フロントエンド）
    # FastAPIが /static をマウントしている場合は不要ですが、
    # 効率化のためにNginxで配信する設定を残します
    location /static/ {
        alias /opt/prompt-provision-tool/frontend/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # APIエンドポイント & アプリケーション
    location / {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # タイムアウト設定（AI APIは時間がかかる場合がある）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ファイルアップロードサイズ制限
    client_max_body_size 10M;
}

