# Nginx設定ファイル
# ConoHa VPS用の設定例

# upstream設定（FastAPIアプリケーション）
upstream fastapi_backend {
    server 127.0.0.1:8000;
}

# HTTPサーバー（HTTPSへリダイレクト）
server {
    listen 80;
    server_name your-domain.com;  # 実際のドメイン名に変更

    # Let's Encryptの認証用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPSへリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPSサーバー
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 実際のドメイン名に変更

    # SSL証明書（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ログ設定
    access_log /var/log/nginx/prompt-tool-access.log;
    error_log /var/log/nginx/prompt-tool-error.log;

    # 静的ファイル（フロントエンド）
    location /static/ {
        alias /opt/prompt-provision-tool/frontend/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # APIエンドポイント
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # タイムアウト設定（AI APIは時間がかかる場合がある）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ルートとドキュメント
    location / {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ファイルアップロードサイズ制限
    client_max_body_size 10M;
}

