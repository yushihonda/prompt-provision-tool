# ============================================================
# ローカル開発環境用 Nginx 設定
# 本番環境（ConoHaVPS）では使用しません
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 静的フロント
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Backend API へのプロキシ
    location /api/ {
        proxy_pass http://ppt-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # タイムアウト設定（AI APIは時間がかかる場合がある、特にResponses API）
        # gpt-5-proは複雑な推論タスクで10分以上かかる場合があるため、タイムアウトを延長
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # OpenAPIドキュメント系（任意）
    location /docs {
        proxy_pass http://ppt-backend:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://ppt-backend:8000/openapi.json;
    }
}
