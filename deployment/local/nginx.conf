# ============================================================
# ローカル開発環境用 Nginx 設定
# 本番環境（ConoHaVPS）では使用しません
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Docker環境: upstream の名前解決が起動時に固定されるのを避けるため、
    # Dockerの内蔵DNS(127.0.0.11)で定期的に再解決する
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静的フロント
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Backend API へのプロキシ
    location /api/ {
        # 変数を介すと、resolver が有効になりIPが変わっても追従できる
        set $backend_upstream ppt-backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # タイムアウト設定
        # SSE ストリーミングは最大90分、AI API 実行は最大10分
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 5400s;  # SSE の 90 分タイムアウトに合わせる
    }

    # OpenAPIドキュメント系（任意）
    location /docs {
        set $backend_upstream ppt-backend:8000;
        proxy_pass http://$backend_upstream/docs;
    }
    location /openapi.json {
        set $backend_upstream ppt-backend:8000;
        proxy_pass http://$backend_upstream/openapi.json;
    }
}
