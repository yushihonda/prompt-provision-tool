<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン - NexMAGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme login-page">
    <div class="login-card">
        <div class="login-logo">NexMAGI</div>
        <p class="login-subtitle">管理コンソール</p>
        <form id="login-form">
            <div class="login-field">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" placeholder="管理者ユーザー名" required>
            </div>
            <div class="login-field">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
            </div>
            <button type="submit" class="login-btn">ログイン</button>
        </form>
    </div>

    <script>
        window.__NEXMAGI_RUNTIME = window.__NEXMAGI_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
