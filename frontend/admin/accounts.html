<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理 - NexMAGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
            <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">アカウント管理</h1>
                <button class="btn btn-admin-create" onclick="showCreateModal()" style="margin-left: auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    アカウント作成
                </button>
            </div>
            <div class="nav" id="desktop-nav" style="display: none;"></div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>タイプ</th>
                            <th>ステータス</th>
                            <th>有効 WF / スキル</th>
                            <th>実行回数</th>
                            <th>トークン数</th>
                            <th>料金</th>
                            <th>API設定</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-tbody">
                        <tr>
                            <td colspan="11" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>




    <script>
        window.__PPT_RUNTIME = window.__PPT_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/mini-cube.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
