<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
            <div class="content">
            <h1 class="page-title">アカウント管理</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div id="desktop-nav" style="display: flex; gap: 10px;"></div>
                <button class="btn btn-success" onclick="showCreateModal()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;">
                    <img src="../img/iconmonstr-id-card-17.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                    アカウント作成
                </button>
            </div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>タイプ</th>
                            <th>ステータス</th>
                            <th>有効 WF / スキル</th>
                            <th>実行回数</th>
                            <th>トークン数</th>
                            <th>料金</th>
                            <th>API設定</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-tbody">
                        <tr>
                            <td colspan="11" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>




    <script>
        window.__PPT_RUNTIME = window.__PPT_RUNTIME || {
            desktop: Boolean(window.__TAURI__?.core?.invoke),
            apiBase: window.__TAURI__?.core?.invoke ? 'http://127.0.0.1:8000' : window.location.origin,
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
