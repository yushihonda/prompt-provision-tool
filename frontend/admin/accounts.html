<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
        <div class="header">
            <span class="tool-name">Prompt Provision Tool</span>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- モバイルメニュー -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-header">
                <span class="tool-name">Prompt Provision Tool</span>
                <button class="hamburger-menu active" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="mobile-menu-content">
                <div class="nav">
                    <button class="nav-item" onclick="location.href='dashboard.html'">ダッシュボード</button>
                    <button class="nav-item" onclick="location.href='prompts.html'">プロンプト管理</button>
                    <button class="nav-item active" onclick="location.href='accounts.html'">アカウント管理</button>
                    <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
                </div>
                <div class="user-info">
                    <span id="mobile-username-display">-</span>
                    <button class="btn btn-logout" onclick="logout()">ログアウト</button>
                </div>
            </div>
        </div>

        <div class="content">
            <h1 class="page-title">アカウント管理</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-item" onclick="location.href='dashboard.html'">ダッシュボード</button>
                    <button class="nav-item" onclick="location.href='prompts.html'">プロンプト管理</button>
                    <button class="nav-item active" onclick="location.href='accounts.html'">アカウント管理</button>
                    <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
                </div>
                <button class="btn btn-success" onclick="showCreateModal()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;">
                    <img src="../img/iconmonstr-id-card-17.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                    アカウント作成
                </button>
            </div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>タイプ</th>
                            <th>ステータス</th>
                            <th>プロンプト数</th>
                            <th>実行回数</th>
                            <th>トークン数</th>
                            <th>料金</th>
                            <th>API設定</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-tbody">
                        <tr>
                            <td colspan="11" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>




    <script src="js/admin-common.js"></script>
    <script src="js/accounts.js"></script>
</html>
