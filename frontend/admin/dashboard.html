<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
        <div class="header">
            <span class="tool-name">Prompt Provision Tool</span>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- モバイルメニュー -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-header">
                <span class="tool-name">Prompt Provision Tool</span>
                <button class="hamburger-menu active" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="mobile-menu-content">
                <div class="nav">
                    <button class="nav-item active" onclick="location.href='dashboard.html'">ダッシュボード</button>
                    <button class="nav-item" onclick="location.href='prompts.html'">プロンプト管理</button>
                    <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                    <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
                </div>
                <div class="user-info">
                    <span id="mobile-username-display">-</span>
                    <button class="btn btn-logout" onclick="logout()">ログアウト</button>
                </div>
            </div>
        </div>

        <div class="content">
            <h1 class="page-title">管理者ダッシュボード</h1>
            <div class="nav">
                <button class="nav-item active" onclick="location.href='dashboard.html'">ダッシュボード</button>
                <button class="nav-item" onclick="location.href='prompts.html'">プロンプト管理</button>
                <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
            </div>


            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>総アカウント数</h3>
                    <div class="value" id="total-accounts">-</div>
                </div>
                <div class="stat-card">
                    <h3>総プロンプト数</h3>
                    <div class="value" id="total-prompts">-</div>
                </div>
                <div class="stat-card">
                    <h3>総実行回数</h3>
                    <div class="value" id="total-executions">-</div>
                </div>
                <div class="stat-card">
                    <h3>今日の実行</h3>
                    <div class="value" id="executions-today">-</div>
                </div>
                <div class="stat-card">
                    <h3>今月の実行</h3>
                    <div class="value" id="executions-month">-</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-purple" onclick="location.href='prompts.html'" style="display: inline-flex; align-items: center; gap: 8px;">
                    <img src="../img/iconmonstr-text-plus-lined.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                    プロンプト管理
                </button>
                <button class="btn btn-success" onclick="location.href='accounts.html'" style="display: inline-flex; align-items: center; gap: 8px;">
                    <img src="../img/iconmonstr-id-card-17.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                    アカウント管理
                </button>
                <button class="btn btn-secondary" onclick="location.href='executions.html'" style="display: inline-flex; align-items: center; gap: 8px;">
                    実行ログ
                </button>
            </div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script>
        async function loadDashboardStats() {
            try {
                const stats = await apiRequest('/api/admin/dashboard');

                document.getElementById('total-accounts').textContent = stats.total_accounts;
                document.getElementById('total-prompts').textContent = stats.total_prompts;
                document.getElementById('total-executions').textContent = stats.total_executions;
                document.getElementById('executions-today').textContent = stats.executions_today;
                document.getElementById('executions-month').textContent = stats.executions_this_month;
            } catch (error) {
                showAlert('統計情報の読み込みに失敗しました', 'error');
                console.error('Dashboard error:', error);
            }
        }

        // ページ読み込み時に実行
        (async () => {
            await checkAuth();
            loadDashboardStats();
        })();
    </script>
</body>
</html>
