<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ダッシュボード - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 管理者ダッシュボード</h1>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="content">
            <div class="nav">
                <button class="nav-item active" onclick="location.href='dashboard.html'">ダッシュボード</button>
                <button class="nav-item" onclick="location.href='prompts.html'">プロンプト管理</button>
                <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
            </div>

            <div id="alert-container"></div>

            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>総アカウント数</h3>
                    <div class="value" id="total-accounts">-</div>
                </div>
                <div class="stat-card">
                    <h3>総プロンプト数</h3>
                    <div class="value" id="total-prompts">-</div>
                </div>
                <div class="stat-card">
                    <h3>総実行回数</h3>
                    <div class="value" id="total-executions">-</div>
                </div>
                <div class="stat-card">
                    <h3>今日の実行</h3>
                    <div class="value" id="executions-today">-</div>
                </div>
                <div class="stat-card">
                    <h3>今月の実行</h3>
                    <div class="value" id="executions-month">-</div>
                </div>
            </div>

            <h2>クイックアクション</h2>
            <div class="actions">
                <button class="btn btn-success" onclick="location.href='prompts.html'">新しいプロンプトを作成</button>
                <button class="btn btn-primary" onclick="location.href='accounts.html'">新しいアカウントを作成</button>
            </div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script>
        async function loadDashboardStats() {
            try {
                const stats = await apiRequest('/api/admin/dashboard');

                document.getElementById('total-accounts').textContent = stats.total_accounts;
                document.getElementById('total-prompts').textContent = stats.total_prompts;
                document.getElementById('total-executions').textContent = stats.total_executions;
                document.getElementById('executions-today').textContent = stats.executions_today;
                document.getElementById('executions-month').textContent = stats.executions_this_month;
            } catch (error) {
                showAlert('統計情報の読み込みに失敗しました', 'error');
                console.error('Dashboard error:', error);
            }
        }

        // ページ読み込み時に実行
        checkAuth();
        loadDashboardStats();
    </script>
</body>
</html>
