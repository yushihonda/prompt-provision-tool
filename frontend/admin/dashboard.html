<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークフロー / スキル管理 - NexMAGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
            <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">ワークフロー / スキル管理</h1>
                <div style="display: flex; gap: 8px; align-items: center; margin-left: auto;">
                    <button type="button" class="btn btn-admin-create" onclick="showCreateWorkflowFromSkills()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        ワークフロー作成
                    </button>
                    <button class="btn btn-admin-skill" onclick="showCreateModal()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        スキル作成
                    </button>
                </div>
            </div>
            <div class="nav" id="desktop-nav" style="display: none;"></div>

            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>総アカウント数</h3>
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 50px;">
                        <div class="value" id="total-accounts">-</div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>総利用可能数</h3>
                    <div style="display: flex; align-items: center; gap: 0;">
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: var(--content-text-muted); margin-bottom: 2px;">ワークフロー</div>
                            <div class="value" id="total-workflows">-</div>
                        </div>
                        <div style="width: 1px; height: 36px; background: rgba(0,0,0,0.08); flex-shrink: 0;"></div>
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: var(--content-text-muted); margin-bottom: 2px;">スキル</div>
                            <div class="value" id="total-skills">-</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>総実行回数</h3>
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 50px;">
                        <div class="value" id="total-executions">-</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">ワークフロー一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ワークフロー名</th>
                            <th>説明</th>
                            <th>モデル</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="workflows-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="workflows-pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">スキル一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>スキル名</th>
                            <th>説明</th>
                            <th>モデル</th>
                            <th>ステータス</th>
                            <th>出力/ツール</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="skills-tbody">
                        <tr>
                            <td colspan="7" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        window.__NEXMAGI_RUNTIME = window.__NEXMAGI_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/mini-cube.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/skills.js"></script>
</body>
</html>
