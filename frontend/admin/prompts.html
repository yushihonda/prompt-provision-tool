<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロンプト管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 プロンプト管理</h1>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="content">
            <div class="nav">
                <button class="nav-item" onclick="location.href='dashboard.html'">ダッシュボード</button>
                <button class="nav-item active" onclick="location.href='prompts.html'">プロンプト管理</button>
                <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
            </div>

            <div id="alert-container"></div>

            <button class="btn btn-success" onclick="showCreateModal()">新しいプロンプトを作成</button>

            <div id="prompts-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- プロンプト作成/編集モーダル -->
    <div id="prompt-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">新しいプロンプト</h2>
                <button class="close-modal" onclick="hideModal('prompt-modal')">&times;</button>
            </div>
            <form id="prompt-form">
                <input type="hidden" id="prompt-id">
                <div class="form-group">
                    <label for="prompt-name">プロンプト名 *</label>
                    <input type="text" id="prompt-name" required>
                </div>
                <div class="form-group">
                    <label for="prompt-description">説明</label>
                    <textarea id="prompt-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="prompt-model">AIモデル *</label>
                    <select id="prompt-model" required>
                        <optgroup label="OpenAI">
                            <option value="gpt-5-thinking" selected>GPT-5 Thinking</option>
                            <option value="gpt-5-pro">GPT-5 Pro</option>
                            <option value="gpt-5">GPT-5</option>
                            <option value="gpt-4o-mini">GPT-4o Mini</option>
                        </optgroup>
                        <optgroup label="Gemini">
                            <option value="gemini-2.5-pro-deep-think">Gemini 2.5 Pro Deep Think</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro（無料枠: 1日100リクエスト、有料版で制限なし）</option>
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prompt-content">プロンプト内容 *</label>
                    <textarea id="prompt-content" rows="10" placeholder="プロンプトを入力してください。&#10;変数は {{variable_name}} の形式で記述できます。" required></textarea>
                    <small style="color: #6c757d;">変数の例: {{article_text}}, {{input}}, {{query}} など</small>
                </div>
                <div class="form-group">
                    <label for="prompt-schema">入力スキーマ（JSON形式、オプション）</label>
                    <textarea id="prompt-schema" rows="5" placeholder='{"field_name": {"type": "string", "label": "フィールドラベル", "required": true}}'></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="prompt-allows-file-output">
                        ファイル出力を許可する
                    </label>
                    <small style="color: #6c757d;">チェックすると、このプロンプトの実行結果をCSV、PDF、DOCXなどの形式で出力できます</small>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="hideModal('prompt-modal')">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <!-- プロンプト内容表示モーダル -->
    <div id="view-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>プロンプト内容</h2>
                <button class="close-modal" onclick="hideModal('view-modal')">&times;</button>
            </div>
            <div class="json-display" id="prompt-content-display"></div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script>
        let prompts = [];

        async function loadPrompts() {
            try {
                prompts = await apiRequest('/api/admin/prompts');
                renderPrompts();
            } catch (error) {
                showAlert('プロンプトの読み込みに失敗しました', 'error');
                console.error('Load prompts error:', error);
            }
        }

        function renderPrompts() {
            const container = document.getElementById('prompts-container');

            if (prompts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6c757d;">プロンプトがまだ登録されていません</p>';
                return;
            }

            container.innerHTML = prompts.map(prompt => `
                <div class="card">
                    <h3>${prompt.name}</h3>
                    <p>${prompt.description || '説明なし'}</p>
                    <p><strong>モデル:</strong> ${prompt.model_type}</p>
                    <p><strong>ステータス:</strong> ${prompt.is_active ? '有効' : '無効'}</p>
                    <p><strong>ファイル出力:</strong> ${prompt.allows_file_output ? '✅ 許可' : '❌ 不可'}</p>
                    <div class="actions">
                        <button class="btn btn-sm btn-primary" onclick="viewPromptContent(${prompt.id})">内容を表示</button>
                        <button class="btn btn-sm btn-secondary" onclick="editPrompt(${prompt.id})">編集</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePrompt(${prompt.id})">削除</button>
                    </div>
                </div>
            `).join('');
        }

        function showCreateModal() {
            document.getElementById('modal-title').textContent = '新しいプロンプト';
            document.getElementById('prompt-form').reset();
            document.getElementById('prompt-id').value = '';
            showModal('prompt-modal');
        }

        async function editPrompt(id) {
            const prompt = prompts.find(p => p.id === id);
            if (!prompt) return;

            document.getElementById('modal-title').textContent = 'プロンプトを編集';
            document.getElementById('prompt-id').value = prompt.id;
            document.getElementById('prompt-name').value = prompt.name;
            document.getElementById('prompt-description').value = prompt.description || '';
            document.getElementById('prompt-model').value = prompt.model_type;

            // プロンプト内容を取得
            try {
                const data = await apiRequest(`/api/admin/prompts/${id}/content`);
                document.getElementById('prompt-content').value = data.content;
            } catch (error) {
                showAlert('プロンプト内容の読み込みに失敗しました', 'error');
            }

            if (prompt.input_schema) {
                document.getElementById('prompt-schema').value = formatJSON(prompt.input_schema);
            }

            document.getElementById('prompt-allows-file-output').checked = prompt.allows_file_output || false;

            showModal('prompt-modal');
        }

        async function viewPromptContent(id) {
            try {
                const data = await apiRequest(`/api/admin/prompts/${id}/content`);
                document.getElementById('prompt-content-display').textContent = data.content;
                showModal('view-modal');
            } catch (error) {
                showAlert('プロンプト内容の読み込みに失敗しました', 'error');
            }
        }

        async function deletePrompt(id) {
            if (!confirmAction('本当にこのプロンプトを削除しますか？')) return;

            try {
                await apiRequest(`/api/admin/prompts/${id}`, {
                    method: 'DELETE'
                });
                showAlert('プロンプトを削除しました', 'success');
                loadPrompts();
            } catch (error) {
                showAlert('プロンプトの削除に失敗しました', 'error');
                console.error('Delete prompt error:', error);
            }
        }

        document.getElementById('prompt-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const promptId = document.getElementById('prompt-id').value;
            const name = document.getElementById('prompt-name').value;
            const description = document.getElementById('prompt-description').value;
            const model = document.getElementById('prompt-model').value;
            const content = document.getElementById('prompt-content').value;
            const schemaText = document.getElementById('prompt-schema').value;

            let inputSchema = null;
            if (schemaText.trim()) {
                try {
                    inputSchema = JSON.parse(schemaText);
                } catch {
                    showAlert('入力スキーマのJSON形式が正しくありません', 'error');
                    return;
                }
            }

            const data = {
                name,
                description,
                model_type: model,
                content,
                input_schema: inputSchema,
                allows_file_output: document.getElementById('prompt-allows-file-output').checked
            };

            try {
                if (promptId) {
                    // 更新
                    await apiRequest(`/api/admin/prompts/${promptId}`, {
                        method: 'PATCH',
                        body: JSON.stringify(data)
                    });
                    showAlert('プロンプトを更新しました', 'success');
                } else {
                    // 作成
                    await apiRequest('/api/admin/prompts', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    showAlert('プロンプトを作成しました', 'success');
                }

                hideModal('prompt-modal');
                loadPrompts();
            } catch (error) {
                showAlert('プロンプトの保存に失敗しました', 'error');
                console.error('Save prompt error:', error);
            }
        });

        // ページ読み込み時に実行
        checkAuth();
        loadPrompts();
    </script>
</body>
</html>
