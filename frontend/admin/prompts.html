<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロンプト管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
        <div class="header">
            <span class="tool-name">Prompt Provision Tool</span>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- モバイルメニュー -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-header">
                <span class="tool-name">Prompt Provision Tool</span>
                <button class="hamburger-menu active" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="mobile-menu-content">
                <div class="nav">
                    <button class="nav-item" onclick="location.href='dashboard.html'">ダッシュボード</button>
                    <button class="nav-item active" onclick="location.href='prompts.html'">プロンプト管理</button>
                    <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                    <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
                </div>
                <div class="user-info">
                    <span id="mobile-username-display">-</span>
                    <button class="btn btn-logout" onclick="logout()">ログアウト</button>
                </div>
            </div>
        </div>

            <div class="content">
            <h1 class="page-title">プロンプト管理</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-item" onclick="location.href='dashboard.html'">ダッシュボード</button>
                    <button class="nav-item active" onclick="location.href='prompts.html'">プロンプト管理</button>
                    <button class="nav-item" onclick="location.href='accounts.html'">アカウント管理</button>
                    <button class="nav-item" onclick="location.href='executions.html'">実行ログ</button>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn btn-outline" onclick="showCreateWorkflowFromPrompts()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-color: rgba(156,39,176,0.5); color: #e1bee7;">
                        <img src="../img/iconmonstr-apps-filled.svg" alt="WF" style="width: 16px; height: 16px; filter: brightness(0) invert(1); opacity: 0.85;">
                        ワークフロー作成
                    </button>
                    <button class="btn btn-purple" onclick="showCreateModal()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;">
                        <img src="../img/iconmonstr-text-plus-lined.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                        プロンプト作成
                    </button>
                </div>
            </div>


            <div class="card">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">ワークフロー一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ワークフロー名</th>
                            <th>説明</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="workflows-tbody">
                        <tr>
                            <td colspan="5" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="workflows-pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">Skill（プロンプト）一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>プロンプト名</th>
                            <th>説明</th>
                            <th>モデル</th>
                            <th>ステータス</th>
                            <th>出力/ツール</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="prompts-tbody">
                        <tr>
                            <td colspan="7" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>
        </div>
    </div>

    <script src="js/admin-common.js"></script>
    <script src="js/prompts.js"></script>
</html>
