<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実行ログ - NexMAGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
            <div class="content">
            <div class="page-title-container"><h1 class="page-title">実行ログ</h1></div>
            <div class="nav" id="desktop-nav"></div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>日時</th>
                            <th>アカウントID</th>
                            <th>ワークフロー / スキル</th>
                            <th>モデル</th>
                            <th>実行時間</th>
                            <th>トークン数</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="executions-tbody">
                        <tr>
                            <td colspan="9" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>


    <script>
        window.__PPT_RUNTIME = window.__PPT_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="../js/mini-cube.js"></script>
    <script src="../js/exec-detail-modal.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/executions.js"></script>
</body>
</html>
