<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークフロー / スキル管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-theme">
    <div class="container">
            <div class="content">
            <h1 class="page-title">ワークフロー / スキル管理</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div id="desktop-nav" style="display: flex; gap: 10px;"></div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button type="button" class="btn btn-workflow" onclick="showCreateWorkflowFromSkills()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;">
                        <img src="../img/iconmonstr-apps-filled.svg" alt="" width="18" height="18" class="btn-workflow-icon" aria-hidden="true">
                        ワークフロー作成
                    </button>
                    <button class="btn btn-purple" onclick="showCreateModal()" style="white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;">
                        <img src="../img/iconmonstr-text-plus-lined.svg" alt="作成" style="width: 18px; height: 18px; filter: brightness(0) invert(1);">
                        スキル作成
                    </button>
                </div>
            </div>

            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>総アカウント数</h3>
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 50px;">
                        <div class="value" id="total-accounts">-</div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>総利用可能数</h3>
                    <div style="display: flex; align-items: center; gap: 0;">
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: rgba(255,255,255,0.45); margin-bottom: 2px;">ワークフロー</div>
                            <div class="value" id="total-workflows">-</div>
                        </div>
                        <div style="width: 1px; height: 36px; background: rgba(255,255,255,0.15); flex-shrink: 0;"></div>
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: rgba(255,255,255,0.45); margin-bottom: 2px;">スキル</div>
                            <div class="value" id="total-skills">-</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>総実行回数</h3>
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 50px;">
                        <div class="value" id="total-executions">-</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">ワークフロー一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ワークフロー名</th>
                            <th>説明</th>
                            <th>モデル</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="workflows-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="workflows-pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2 style="font-size: 16px; margin: 0 0 8px; font-weight: bold;">スキル一覧</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>スキル名</th>
                            <th>説明</th>
                            <th>モデル</th>
                            <th>ステータス</th>
                            <th>出力/ツール</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="skills-tbody">
                        <tr>
                            <td colspan="7" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="pagination-container" class="pagination" style="display: none; margin-top: 8px;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/skills.js"></script>
</html>
