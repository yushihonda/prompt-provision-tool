<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークフロー / スキル管理 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <h1 class="page-title">ワークフロー / スキル管理</h1>
            <div class="nav" id="desktop-nav"></div>


            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>利用可能なスキル</h3>
                    <div class="value" id="available-skills">-</div>
                </div>
                <div class="stat-card">
                    <h3>今月の総実行</h3>
                    <div class="value" id="executions-month">-</div>
                </div>
                <div class="stat-card">
                    <h3>今月の総トークン数</h3>
                    <div class="value" id="total-tokens-month">-</div>
                </div>
                <div class="stat-card">
                    <h3>今月の総トークン料金</h3>
                    <div class="value" id="total-cost-month">-</div>
                </div>
            </div>

            <div class="card card-graph" style="margin-top: 20px;">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin: 0;">実行活動グラフ</h2>
                    <select id="year-select" style="padding: 5px 10px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.9);">
                        <!-- JavaScriptで動的に生成 -->
                    </select>
                </div>
                <div class="card-content card-content-graph">
                    <div id="contribution-graph-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2 style="margin-top: 0;">ワークフロー一覧</h2>
                <div id="workflows-container" class="skills-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h2 style="margin-top: 0;">スキル一覧</h2>
                <div id="skills-container" class="skills-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
                <div id="pagination-container" class="pagination" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="../js/model-display.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
