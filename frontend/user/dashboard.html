<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexMAGI - ワークフロー / スキル管理</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <div class="nav" id="desktop-nav"></div>


            <div class="dashboard-stats" id="stats-container">
                <div class="stat-card">
                    <h3>利用可能数</h3>
                    <div style="display: flex; align-items: center; gap: 0;">
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">ワークフロー</div>
                            <div class="value" id="available-workflows">-</div>
                        </div>
                        <div style="width: 1px; height: 36px; background: #ddd; flex-shrink: 0;"></div>
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">スキル</div>
                            <div class="value" id="available-skills">-</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>実行回数</h3>
                    <div style="display: flex; align-items: center; gap: 0;">
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">今月</div>
                            <div class="value" id="executions-month">-</div>
                        </div>
                        <div style="width: 1px; height: 36px; background: #ddd; flex-shrink: 0;"></div>
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">累計</div>
                            <div class="value" id="total-executions">-</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>トークン数</h3>
                    <div style="display: flex; align-items: center; gap: 0;">
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">今月</div>
                            <div class="value" id="total-tokens-month">-</div>
                        </div>
                        <div style="width: 1px; height: 36px; background: #ddd; flex-shrink: 0;"></div>
                        <div style="flex: 1; text-align: center;">
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px;">累計</div>
                            <div class="value" id="total-tokens">-</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>トークン料金</h3>
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 50px;">
                        <div>
                            <div style="font-size: 10px; color: #a0a0a0; margin-bottom: 2px; text-align: center;">今月</div>
                            <div class="value" id="total-cost-month">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-graph" style="margin-top: 20px;">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin: 0; color: #2d2d2d;">実行活動グラフ</h2>
                    <select id="year-select" style="padding: 5px 10px; border-radius: 8px; background: #eee; border: 1px solid #ddd; color: #2d2d2d;">
                        <!-- JavaScriptで動的に生成 -->
                    </select>
                </div>
                <div class="card-content card-content-graph">
                    <div id="contribution-graph-container">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 28px;">
                <h2 style="margin: 0 0 16px 0; color: var(--content-text); font-size: 18px; font-weight: 700;">ワークフロー一覧</h2>
                <div id="workflows-container" class="skills-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
            </div>

            <div style="margin-top: 28px;">
                <h2 style="margin: 0 0 16px 0; color: var(--content-text); font-size: 18px; font-weight: 700;">スキル一覧</h2>
                <div id="skills-container" class="skills-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
                <div id="pagination-container" class="pagination" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        window.__PPT_RUNTIME = window.__PPT_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/mini-cube.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
