<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実行履歴 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <h1 class="page-title">実行履歴</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div id="desktop-nav" style="display: flex; gap: 10px;"></div>
                <button class="btn btn-secondary" onclick="location.href='dashboard.html'" style="display: inline-flex; align-items: center; gap: 5px; padding: 10px 20px;">
                    ← ワークフロー / スキル管理に戻る
                </button>
            </div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>実行日時</th>
                            <th>ワークフロー / スキル</th>
                            <th>モデル</th>
                            <th>出力形式</th>
                            <th>実行時間</th>
                            <th>トークン数</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="8" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>


    <script src="../js/model-display.js"></script>
    <script src="../js/exec-detail-modal.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/history.js"></script>

</body>
</html>
