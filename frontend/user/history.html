<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実行履歴 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="header">
            <span class="tool-name">Prompt Provision Tool</span>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- モバイルメニュー -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-header">
                <span class="tool-name">Prompt Provision Tool</span>
                <button class="hamburger-menu active" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="mobile-menu-content">
                <div class="nav">
                    <button class="nav-item" onclick="location.href='dashboard.html'">プロンプト一覧</button>
                    <button class="nav-item active" onclick="location.href='history.html'">実行履歴</button>
                </div>
                <div class="user-info">
                    <span id="mobile-username-display">-</span>
                    <button class="btn btn-logout" onclick="logout()">ログアウト</button>
                </div>
            </div>
        </div>

        <div class="content">
            <h1 class="page-title">実行履歴</h1>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-item" onclick="location.href='dashboard.html'">プロンプト一覧</button>
                    <button class="nav-item active" onclick="location.href='history.html'">実行履歴</button>
                </div>
                <button class="btn btn-secondary" onclick="location.href='dashboard.html'" style="display: inline-flex; align-items: center; gap: 5px; padding: 10px 20px;">
                    ← プロンプト一覧に戻る
                </button>
            </div>


            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>実行日時</th>
                            <th>プロンプト/ワークフロー</th>
                            <th>モデル</th>
                            <th>出力形式</th>
                            <th>実行時間</th>
                            <th>トークン数</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="8" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-container" class="pagination" style="display: none;"></div>
        </div>
    </div>


    <script src="js/user-common.js"></script>
    <script src="js/history.js"></script>

</body>
</html>
