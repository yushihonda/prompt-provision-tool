<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スキル実行 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">スキル実行</h1>
            </div>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-item" onclick="window.PPTRuntime.navigate('dashboard.html')">ワークフロー / スキル管理</button>
                    <button class="nav-item" onclick="window.PPTRuntime.navigate('history.html')">実行履歴</button>
                </div>
                <button class="btn btn-secondary" onclick="window.PPTRuntime.navigate('dashboard.html')" style="display: inline-flex; align-items: center; gap: 5px; padding: 10px 20px;">
                    ← ワークフロー / スキル管理に戻る
                </button>
            </div>


            <div class="card">
                <h2 id="skill-name">-</h2>
                <p id="skill-description">-</p>
                <p><strong>モデル:</strong> <span id="skill-model">-</span></p>
            </div>

            <div class="execute-layout">
                <div class="execute-input-panel">
                    <h3>入力</h3>
                    <form id="execute-form">
                        <div id="input-fields-container">
                            <!-- 動的に生成される入力フィールド -->
                        </div>

                        <div id="file-output-container" style="display: none;">
                            <div class="form-group">
                                <label for="output-format">出力形式</label>
                                <select id="output-format">
                                    <option value="txt">テキスト (TXT)</option>
                                    <option value="csv">CSV</option>
                                    <option value="pdf">PDF</option>
                                    <option value="docx">Word (DOCX)</option>
                                    <option value="md">Markdown (MD)</option>
                                </select>
                                <small style="color: rgba(255, 255, 255, 0.6);">実行結果を指定した形式でファイルとして出力できます</small>
                            </div>
                        </div>

                        <div style="margin-top: 8px; padding: 8px 12px; background: rgba(40, 167, 69, 0.08); border: 1px solid rgba(40, 167, 69, 0.2); border-radius: 6px; font-size: 11px; color: rgba(255,255,255,0.6);">
                            ローカルワーカーで実行されます。ターミナルで <code style="background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:3px; cursor:pointer;" onclick="navigator.clipboard.writeText('python -m local_worker daemon')" title="コピー">python -m local_worker daemon</code> を起動してください。
                        </div>

                        <button type="submit" class="btn btn-primary" id="execute-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <span id="execute-btn-text">実行</span>
                            <span id="execute-btn-spinner" style="display: none;">
                                <div class="spinner" style="display: inline-block; width: 16px; height: 16px; border-width: 2px; vertical-align: middle;"></div>
                            </span>
                        </button>
                    </form>
                </div>

                <div class="execute-output-panel">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                        <h3 style="margin: 0;">出力</h3>
                        <button onclick="copyOutput()" title="出力をコピー" class="icon-btn" id="copy-output-btn" style="display: flex; align-items: center; justify-content: center; padding: 8px; background: none; border: none; cursor: pointer; transition: transform 0.2s ease, opacity 0.2s ease; opacity: 0.5;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: rgba(255, 255, 255, 0.7); transition: fill 0.2s ease, transform 0.2s ease;"><path d="M16 10c3.469 0 2 4 2 4s4-1.594 4 2v6h-10v-12h4zm.827-2h-6.827v16h14v-8.842c0-2.392-4.011-7.158-7.173-7.158zm-8.827 12h-6v-16h4l2.102 2h3.898l2-2h4v2.145c.656.143 1.327.391 2 .754v-4.899h-3c-1.229 0-2.18-1.084-3-2h-8c-.82.916-1.771 2-3 2h-3v20h8v-2zm2-18c.553 0 1 .448 1 1s-.447 1-1 1-1-.448-1-1 .447-1 1-1zm4 18h6v-1h-6v1zm0-2h6v-1h-6v1zm0-2h6v-1h-6v1z"/></svg>
                        </button>
                    </div>
                    <div id="result-container">
                        <div class="output-box" id="output-content">実行ボタンを押すと結果がここに表示されます</div>
                        <div id="file-output-result" style="display: none;"></div>
                        <div class="stats">
                            <div class="stat-item">
                                <label>使用モデル</label>
                                <value id="stat-model">-</value>
                            </div>
                            <div class="stat-item">
                                <label>実行時間</label>
                                <value id="stat-time">-</value>
                            </div>
                            <div class="stat-item">
                                <label>トークン数</label>
                                <value id="stat-tokens">-</value>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="history-section card" style="margin-top: 30px;">
                <h3>実行履歴</h3>
                <div id="history-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.__PPT_RUNTIME = window.__PPT_RUNTIME || {
            desktop: Boolean(window.__TAURI__?.core?.invoke),
            apiBase: window.__TAURI__?.core?.invoke ? 'http://127.0.0.1:8000' : window.location.origin,
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="../js/exec-detail-modal.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/execute.js"></script>
</body>
</html>
