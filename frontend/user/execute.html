<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロンプト実行 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="header">
            <span class="tool-name">Prompt Provision Tool</span>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- モバイルメニュー -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-header">
                <span class="tool-name">Prompt Provision Tool</span>
                <button class="hamburger-menu active" onclick="toggleMobileMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="mobile-menu-content">
                <div class="nav">
                    <button class="nav-item" onclick="location.href='dashboard.html'">プロンプト一覧</button>
                    <button class="nav-item" onclick="location.href='history.html'">実行履歴</button>
                </div>
                <div class="user-info">
                    <span id="mobile-username-display">-</span>
                    <button class="btn btn-logout" onclick="logout()">ログアウト</button>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">プロンプト実行</h1>
                <button class="btn btn-secondary mobile-back-button" onclick="location.href='dashboard.html'">
                    ← 戻る
                </button>
            </div>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="nav-item" onclick="location.href='dashboard.html'">プロンプト一覧</button>
                    <button class="nav-item" onclick="location.href='history.html'">実行履歴</button>
                </div>
                <button class="btn btn-secondary" onclick="location.href='dashboard.html'" style="display: inline-flex; align-items: center; gap: 5px; padding: 10px 20px;">
                    ← プロンプト一覧に戻る
                </button>
            </div>


            <div class="card">
                <h2 id="prompt-name">-</h2>
                <p id="prompt-description">-</p>
                <p><strong>モデル:</strong> <span id="prompt-model">-</span></p>
            </div>

            <div class="execute-layout">
                <div class="execute-input-panel">
                    <h3>入力</h3>
                    <form id="execute-form">
                        <div id="input-fields-container">
                            <!-- 動的に生成される入力フィールド -->
                        </div>

                        <div id="file-output-container" style="display: none;">
                            <div class="form-group">
                                <label for="output-format">出力形式</label>
                                <select id="output-format">
                                    <option value="txt">テキスト (TXT)</option>
                                    <option value="csv">CSV</option>
                                    <option value="pdf">PDF</option>
                                    <option value="docx">Word (DOCX)</option>
                                    <option value="md">Markdown (MD)</option>
                                </select>
                                <small style="color: rgba(255, 255, 255, 0.6);">実行結果を指定した形式でファイルとして出力できます</small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="execute-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <span id="execute-btn-text">実行</span>
                            <span id="execute-btn-spinner" style="display: none;">
                                <div class="spinner" style="display: inline-block; width: 16px; height: 16px; border-width: 2px; vertical-align: middle;"></div>
                            </span>
                        </button>
                    </form>
                </div>

                <div class="execute-output-panel">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                        <h3 style="margin: 0;">出力</h3>
                        <button onclick="copyOutput()" title="出力をコピー" class="icon-btn" id="copy-output-btn" style="display: flex; align-items: center; justify-content: center; padding: 8px; background: none; border: none; cursor: pointer; transition: transform 0.2s ease, opacity 0.2s ease; opacity: 0.5;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: rgba(255, 255, 255, 0.7); transition: fill 0.2s ease, transform 0.2s ease;"><path d="M16 10c3.469 0 2 4 2 4s4-1.594 4 2v6h-10v-12h4zm.827-2h-6.827v16h14v-8.842c0-2.392-4.011-7.158-7.173-7.158zm-8.827 12h-6v-16h4l2.102 2h3.898l2-2h4v2.145c.656.143 1.327.391 2 .754v-4.899h-3c-1.229 0-2.18-1.084-3-2h-8c-.82.916-1.771 2-3 2h-3v20h8v-2zm2-18c.553 0 1 .448 1 1s-.447 1-1 1-1-.448-1-1 .447-1 1-1zm4 18h6v-1h-6v1zm0-2h6v-1h-6v1zm0-2h6v-1h-6v1z"/></svg>
                        </button>
                    </div>
                    <div id="result-container">
                        <div class="output-box" id="output-content">実行ボタンを押すと結果がここに表示されます</div>
                        <div id="file-output-result" style="display: none;"></div>
                        <div class="stats">
                            <div class="stat-item">
                                <label>使用モデル</label>
                                <value id="stat-model">-</value>
                            </div>
                            <div class="stat-item">
                                <label>実行時間</label>
                                <value id="stat-time">-</value>
                            </div>
                            <div class="stat-item">
                                <label>トークン数</label>
                                <value id="stat-tokens">-</value>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="history-section card" style="margin-top: 30px;">
                <h3>実行履歴</h3>
                <div id="history-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>読み込み中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="js/user-common.js"></script>
    <script>
        let promptId = null;
        let promptDetail = null;
        let executions = [];
        let allExecutions = []; // 全ての実行履歴
        let displayedHistoryCount = 3; // 表示する履歴の件数

        async function loadPromptDetail() {
            promptId = getQueryParam('id');
            if (!promptId) {
                showAlert('プロンプトIDが指定されていません', 'error');
                return;
            }

            try {
                promptDetail = await apiRequest(`/api/user/prompts/${promptId}`);

                // プロンプト情報を表示
                document.getElementById('prompt-name').textContent = promptDetail.name;
                document.getElementById('prompt-description').textContent = promptDetail.description || '説明なし';
                let modelDisplay = promptDetail.model_type;

                // Deep Thinkモデルの場合はサフィックスを削除して表示
                let isDeepThinkModel = false;
                if (modelDisplay && modelDisplay.includes('deep-think')) {
                    modelDisplay = modelDisplay.replace('-deep-think', '');
                    isDeepThinkModel = true;
                }

                // Thinkingモデルの場合はサフィックスを削除して表示
                let isThinkingModel = false;
                if (modelDisplay && modelDisplay.includes('thinking')) {
                    modelDisplay = modelDisplay.replace('-thinking', '');
                    isThinkingModel = true;
                }

                // Proモデルの場合は「-pro」を削除してProバッジを追加
                const isProModel = promptDetail.model_type && (promptDetail.model_type.includes('-pro') || promptDetail.model_type.endsWith('-pro'));
                if (isProModel) {
                    // 「-pro」を削除（「-pro-」の場合は「-pro」のみ削除、「-pro」で終わる場合は「-pro」を削除）
                    modelDisplay = modelDisplay.replace(/-pro(?=-|$)/g, '');
                    modelDisplay += `<span class="pro-badge">Pro</span>`;
                }

                // 「-preview」を削除
                modelDisplay = modelDisplay.replace(/-preview/g, '');

                // Deep Thinkバッジを追加（Geminiモデルで有効な場合）
                // 1. モデル名にdeep-thinkが含まれる場合
                // 2. enable_deep_thinkフラグが有効な場合
                const isDeepThinkEnabled = isDeepThinkModel || (promptDetail.enable_deep_think === true || promptDetail.enable_deep_think === 1 || promptDetail.enable_deep_think === 'true');

                if (isDeepThinkEnabled && promptDetail.model_type && promptDetail.model_type.startsWith('gemini-')) {
                    modelDisplay += `<span class="deep-think-badge">Deep Think</span>`;
                }

                // Thinkingバッジを追加（GPT-5.1 Thinkingの場合）
                if (isThinkingModel || promptDetail.model_type === 'gpt-5.1-thinking') {
                    modelDisplay += `<span class="thinking-badge">Thinking</span>`;
                }

                // NEWバッジを追加（gpt-5.2系のみ）
                if (promptDetail.model_type === 'gpt-5.2' || promptDetail.model_type === 'gpt-5.2-pro' || promptDetail.model_type === 'gpt-5.2-thinking') {
                    modelDisplay += `<span class="new-badge">NEW</span>`;
                }
                document.getElementById('prompt-model').innerHTML = modelDisplay;

                // ファイル出力オプションの表示/非表示
                const fileOutputContainer = document.getElementById('file-output-container');
                if (promptDetail.allows_file_output) {
                    fileOutputContainer.style.display = 'block';
                } else {
                    fileOutputContainer.style.display = 'none';
                }


                // 入力フィールドを生成
                generateInputFields(promptDetail.input_schema);

                // 実行履歴を読み込む
                loadHistory();

                // URLパラメータにexecution_idがある場合は、その実行の入力データを復元
                const executionIdParam = getQueryParam('execution_id');
                if (executionIdParam && executionIdParam !== 'undefined' && executionIdParam !== 'null') {
                    await restoreExecutionData(executionIdParam);
                } else {
                    // 実行中のタスクがあるかチェックして復元
                    await restoreActiveExecution();
                }
            } catch (error) {
                showAlert('プロンプト情報の読み込みに失敗しました', 'error');
                console.error('Load prompt detail error:', error);
            }
        }

        async function restoreActiveExecution() {
            // PersistentStatusBarに実行中のタスクがあるか確認
            if (!PersistentStatusBar.executionId || !PersistentStatusBar.promptId) {
                return;
            }

            // 現在のプロンプトIDと一致するか確認
            const currentPromptId = parseInt(promptId);
            if (PersistentStatusBar.promptId !== currentPromptId) {
                return; // 別のプロンプトの実行中なので何もしない
            }

            const executionId = PersistentStatusBar.executionId;

            // 実行ステータスを確認
            try {
                const execution = await apiRequest(`/api/user/executions/${executionId}`);

                if (execution.status === 'success') {
                    // 既に完了している場合は結果を表示
                    // 完了状態をDockに表示（履歴として残す）
                    if (PersistentStatusBar.executionId === executionId) {
                        PersistentStatusBar.markAsCompleted('success');
                    }

                    // 入力データを入力フィールドに復元
                    restoreInputData(execution);

                    // 実行ボタンを再有効化（完了したので）
                    setExecutionButtonState(false);

                    // 実行履歴を再読み込みして最新の状態を表示
                    await loadHistory();

                    // 結果を表示
                    displayExecutionResult(execution, executionId, null);

                    // 完了ポップアップは廃止（Dockの詳細パネルに表示）
                } else if (execution.status === 'error' || execution.status === 'cancelled') {
                    // エラーまたはキャンセル済み
                    // 完了状態をDockに表示（履歴として残す）
                    if (PersistentStatusBar.executionId === executionId) {
                        PersistentStatusBar.markAsCompleted(execution.status);
                    }

                    // 入力データを入力フィールドに復元
                    restoreInputData(execution);

                    // 実行ボタンを再有効化（エラー/キャンセルなので）
                    setExecutionButtonState(false);

                    displayExecutionError(execution);
                    // 実行履歴を再読み込み
                    await loadHistory();
                } else if (execution.status === 'pending' || execution.status === 'processing') {
                    // 実行中なので入力データを復元してからポーリングを再開
                    restoreInputData(execution);
                    setExecutionButtonState(true); // 実行ボタンを非活性化
                    resumePolling(executionId);
                }
            } catch (error) {
                console.error('Failed to restore execution:', error);
                // エラーが発生した場合は、PersistentStatusBarを停止
                PersistentStatusBar.stop();
            }
        }

        function displayExecutionResult(execution, executionIdForDownload = null, outputFormatForDownload = null) {
            // 結果パネルを表示
            const outputPanel = document.querySelector('.execute-output-panel');
            if (outputPanel) {
                outputPanel.style.display = 'flex';
                outputPanel.style.visibility = 'visible';
            }

            // 結果を表示（既存の処理と統合）
            const outputContent = document.getElementById('output-content');
            if (outputContent) {
                outputContent.textContent = execution.output_data || '';
                // スクロールを確実に機能させるため、スタイルを再適用
                outputContent.style.overflowY = 'auto';
                outputContent.style.overflowX = 'hidden';
                outputContent.style.maxHeight = '100%';
            }

            let statModelDisplay = execution.model_used;

            // Deep Thinkモデルの場合はサフィックスを削除して表示
            let isDeepThinkModel = false;
            if (statModelDisplay && statModelDisplay.includes('deep-think')) {
                statModelDisplay = statModelDisplay.replace('-deep-think', '');
                isDeepThinkModel = true;
            }

            // Thinkingモデルの場合はサフィックスを削除して表示
            let isThinkingModel = false;
            if (statModelDisplay && statModelDisplay.includes('thinking')) {
                statModelDisplay = statModelDisplay.replace('-thinking', '');
                isThinkingModel = true;
            }

            // Proモデルの場合は「-pro」を削除してProバッジを追加
            const isProModel = execution.model_used && (execution.model_used.includes('-pro') || execution.model_used.endsWith('-pro'));
            if (isProModel) {
                // 「-pro」を削除（「-pro-」の場合は「-pro」のみ削除、「-pro」で終わる場合は「-pro」を削除）
                statModelDisplay = statModelDisplay.replace(/-pro(?=-|$)/g, '');
                statModelDisplay += `<span class="pro-badge">Pro</span>`;
            }

            // 「-preview」を削除
            statModelDisplay = statModelDisplay.replace(/-preview/g, '');

            // Deep Thinkバッジを追加（実行時に保存されたenable_deep_thinkを使用）
            // 保存されていない場合はプロンプトの設定を参照（後方互換性のため）
            let isDeepThinkEnabled = isDeepThinkModel;

            if (!isDeepThinkEnabled) {
                if (execution.enable_deep_think !== undefined && execution.enable_deep_think !== null) {
                    // 実行時に保存された値を使用
                    isDeepThinkEnabled = execution.enable_deep_think === true || execution.enable_deep_think === 1 || execution.enable_deep_think === 'true';
                } else if (promptDetail) {
                    // 古い実行履歴の場合、プロンプトの設定を参照
                    isDeepThinkEnabled = promptDetail.enable_deep_think === true || promptDetail.enable_deep_think === 1 || promptDetail.enable_deep_think === 'true';
                }
            }

            if (isDeepThinkEnabled && execution.model_used && execution.model_used.startsWith('gemini-')) {
                statModelDisplay += `<span class="deep-think-badge">Deep Think</span>`;
            }

            // Thinkingバッジを追加（GPT-5.1 Thinkingの場合）
            if (isThinkingModel || execution.model_used === 'gpt-5.1-thinking') {
                statModelDisplay += `<span class="thinking-badge">Thinking</span>`;
            }

            // NEWバッジを追加（gpt-5.2系のみ）
            if (execution.model_used === 'gpt-5.2' || execution.model_used === 'gpt-5.2-pro' || execution.model_used === 'gpt-5.2-thinking') {
                statModelDisplay += `<span class="new-badge">NEW</span>`;
            }

            const statModel = document.getElementById('stat-model');
            if (statModel) {
                statModel.innerHTML = statModelDisplay;
            }

            const statTime = document.getElementById('stat-time');
            if (statTime) {
                statTime.textContent = `${execution.execution_time}ms`;
            }

            const statTokens = document.getElementById('stat-tokens');
            if (statTokens) {
                statTokens.textContent = execution.tokens_used || '-';
            }

            // コピーボタンを有効化
            const copyBtn = document.getElementById('copy-output-btn');
            if (copyBtn) {
                copyBtn.style.opacity = '1';
            }

            // 結果パネルにスクロール
            if (outputPanel) {
                // 確実に表示されるように再度設定
                outputPanel.style.display = 'flex';
                outputPanel.style.visibility = 'visible';
                outputPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ファイル出力結果の処理
            const fileOutputDiv = document.getElementById('file-output-result');
            if (executionIdForDownload && outputFormatForDownload && outputFormatForDownload !== 'txt') {
                // ファイルダウンロードボタンを表示
                const downloadLink = document.createElement('a');
                downloadLink.href = "#";
                downloadLink.className = 'btn btn-success';
                downloadLink.textContent = `結果をダウンロード (${outputFormatForDownload.toUpperCase()})`;
                downloadLink.style.marginTop = '10px';
                downloadLink.style.display = 'inline-block';
                downloadLink.onclick = async (e) => {
                    e.preventDefault();
                    try {
                        const response = await fetch(`/api/execute/download/${executionIdForDownload}?output_format=${outputFormatForDownload}`, {
                            headers: {
                                'Authorization': `Bearer ${sessionStorage.getItem('token')}`
                            }
                        });
                        if (!response.ok) throw new Error('Download failed');

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `execution_${executionIdForDownload}.${outputFormatForDownload}`;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                    } catch (err) {
                        showAlert('ダウンロードに失敗しました', 'error');
                    }
                };

                if (fileOutputDiv) {
                    fileOutputDiv.innerHTML = '';
                    fileOutputDiv.appendChild(downloadLink);
                    fileOutputDiv.style.display = 'block';
                }
            } else {
                if (fileOutputDiv) {
                    fileOutputDiv.style.display = 'none';
                }
            }
        }

        function displayExecutionError(execution) {
            // 結果パネルを表示
            const outputPanel = document.querySelector('.execute-output-panel');
            if (outputPanel) {
                outputPanel.style.display = 'flex';
                outputPanel.style.visibility = 'visible';
            }

            const errorMsg = execution.error_message || '実行エラーが発生しました';
            const outputContent = document.getElementById('output-content');
            if (outputContent) {
                outputContent.innerHTML = `
                    <div style="color: ${execution.status === 'cancelled' ? '#ffc107' : '#dc3545'}; text-align: center; padding: 20px;">
                        ${execution.status === 'cancelled' ? '実行がキャンセルされました' : `エラー: ${errorMsg.trim()}`}
                    </div>
                `;
            }

            // 結果パネルにスクロール
            if (outputPanel) {
                outputPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function resumePolling(executionId) {
            // 実行データを取得して入力データを復元（まだ取得していない場合）
            try {
                const execution = await apiRequest(`/api/user/executions/${executionId}`);
                restoreInputData(execution);
            } catch (error) {
                console.error('Failed to load execution data for input restoration:', error);
            }

            // 実行ボタンを非活性化（実行中なので）
            setExecutionButtonState(true);

            // 出力エリアを処理中表示に更新（スピナーなし）
            document.getElementById('output-content').innerHTML = `
                <div style="text-align: center; padding: 20px; color: rgba(255, 255, 255, 0.7);">
                    <p>AIが応答を生成しています...<br>この処理はバックグラウンドで実行されます。</p>
                    <div class="progress-bar-container" style="width: 100%; background-color: rgba(255,255,255,0.1); border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden;">
                        <div class="progress-bar" style="width: 0%; height: 100%; background-color: #007bff; transition: width 0.5s;"></div>
                    </div>
                </div>
            `;

            // ポーリング開始
            const pollInterval = 2000;
            let pollCount = 0;
            const maxPolls = 300;
            let pollIntervalId = null;

            const cleanupPolling = () => {
                if (pollIntervalId) {
                    clearInterval(pollIntervalId);
                    pollIntervalId = null;
                }
            };
            window.addEventListener('beforeunload', cleanupPolling);

            try {
                const pollResult = await new Promise((resolve, reject) => {
                    pollIntervalId = setInterval(async () => {
                        try {
                            pollCount++;

                            const progressBar = document.querySelector('.progress-bar');
                            if (progressBar) {
                                const currentWidth = parseFloat(progressBar.style.width) || 0;
                                if (currentWidth < 90) {
                                    progressBar.style.width = `${currentWidth + (90 - currentWidth) * 0.1}%`;
                                }
                            }

                            if (pollCount > maxPolls) {
                                cleanupPolling();
                                reject(new Error('タイムアウトしました'));
                                return;
                            }

                            const execution = await apiRequest(`/api/user/executions/${executionId}`);

                            // 実行状態を先に確認（完了、エラー、キャンセルの場合は処理を続行）
                            if (execution.status === 'success' || execution.status === 'error' || execution.status === 'cancelled') {
                                // 完了状態の場合は、PersistentStatusBar.executionIdのチェックをスキップ
                            } else if (!PersistentStatusBar.executionId || PersistentStatusBar.executionId !== executionId) {
                                // 実行中の場合のみ、PersistentStatusBar.executionIdのチェックを行う
                                cleanupPolling();
                                reject(new Error('キャンセルされました'));
                                return;
                            }

                            if (execution.status === 'success') {
                                cleanupPolling();
                                if (progressBar) progressBar.style.width = '100%';
                                // 完了状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('success');
                                }
                                // カスタムイベントを発火（他のページから戻ってきた時などに結果を表示するため）
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                resolve(execution);
                            } else if (execution.status === 'error') {
                                cleanupPolling();
                                // エラー状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('error');
                                }
                                // カスタムイベントを発火
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                reject(new Error(execution.error_message || '実行エラーが発生しました'));
                            } else if (execution.status === 'cancelled') {
                                cleanupPolling();
                                // キャンセル状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('cancelled');
                                }
                                // カスタムイベントを発火
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                reject(new Error('実行がキャンセルされました'));
                            }
                        } catch (err) {
                            if (err.message !== 'キャンセルされました') {
                                cleanupPolling();
                                PersistentStatusBar.stop();
                                reject(err);
                            }
                        }
                    }, pollInterval);
                });

                window.removeEventListener('beforeunload', cleanupPolling);

                // 入力データを入力フィールドに復元
                restoreInputData(pollResult);

                // 実行ボタンを再有効化（完了したので）
                setExecutionButtonState(false);

                // 結果を表示
                displayExecutionResult(pollResult, executionId, null);

                // 実行履歴を再読み込み（入力データも含めて表示）
                loadHistory();

                // 出力パネルを確実に表示（loadHistoryの後でも表示されるように）
                const outputPanel = document.querySelector('.execute-output-panel');
                if (outputPanel) {
                    outputPanel.style.display = 'flex';
                    outputPanel.style.visibility = 'visible';
                }
            } catch (error) {
                window.removeEventListener('beforeunload', cleanupPolling);

                // 実行ボタンを再有効化（エラー/キャンセルなので）
                setExecutionButtonState(false);

                if (error.message === 'キャンセルされました' || error.message === '実行がキャンセルされました') {
                    displayExecutionError({ status: 'cancelled', error_message: error.message });
                } else {
                    displayExecutionError({ status: 'error', error_message: error.message });
                }
                // エラー時も履歴を再読み込み
                loadHistory();
            }
        }

        function restoreInputData(execution) {
            // 入力データを入力フィールドに設定
            if (execution.input_data) {
                let inputData;
                try {
                    // input_dataが文字列の場合はJSONパース
                    if (typeof execution.input_data === 'string') {
                        inputData = JSON.parse(execution.input_data);
                    } else {
                        inputData = execution.input_data;
                    }

                    // 各入力フィールドに値を設定
                    Object.entries(inputData).forEach(([key, value]) => {
                        const inputElement = document.querySelector(`#${key}, [name="${key}"]`);
                        if (inputElement) {
                            inputElement.value = value || '';
                        }
                    });
                } catch (e) {
                    console.error('Failed to parse input data:', e);
                }
            }
        }

        async function restoreExecutionData(executionId) {
            // URLパラメータで指定されたexecution_idのデータを復元
            // executionIdが有効でない場合は処理をスキップ
            if (!executionId || executionId === 'undefined' || executionId === 'null' || executionId === '') {
                console.warn('Invalid executionId:', executionId);
                return;
            }

            // 数値に変換して有効性をチェック
            const executionIdNum = parseInt(executionId, 10);
            if (isNaN(executionIdNum) || executionIdNum <= 0) {
                console.warn('Invalid executionId (not a positive number):', executionId);
                return;
            }

            try {
                const execution = await apiRequest(`/api/user/executions/${executionIdNum}`);

                // 現在のプロンプトIDと一致するか確認
                const currentPromptId = parseInt(promptId);
                if (execution.prompt_id !== currentPromptId) {
                    console.warn('Execution prompt_id does not match current prompt_id');
                    return;
                }

                // 入力データを復元（キャンセル時も復元）
                restoreInputData(execution);

                // 実行ボタンの状態を設定（完了済みの場合は有効化）
                if (execution.status === 'success' || execution.status === 'error' || execution.status === 'cancelled') {
                    setExecutionButtonState(false);
                } else {
                    // 実行中またはpendingの場合は無効化
                    setExecutionButtonState(true);
                }

                // キャンセル時は入力データのみ復元し、出力パネルは表示しない
                if (execution.status === 'cancelled') {
                    // 出力パネルは表示しない（入力データのみ復元）
                    return;
                }

                // 出力パネルを確実に表示（先に表示してから結果を表示）
                const outputPanel = document.querySelector('.execute-output-panel');
                if (outputPanel) {
                    outputPanel.style.display = 'flex';
                    outputPanel.style.visibility = 'visible';
                }

                // 結果がある場合は表示
                if (execution.status === 'success') {
                    displayExecutionResult(execution, executionId, null);
                } else if (execution.status === 'error') {
                    displayExecutionError(execution);
                }

                // 出力パネルにスクロール（少し遅延させて確実に表示されるように）
                setTimeout(() => {
                    if (outputPanel) {
                        outputPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100);
            } catch (error) {
                console.error('Failed to restore execution data:', error);
                showAlert('実行データの復元に失敗しました', 'error');
            }
        }

        function setExecutionButtonState(isExecuting) {
            const executeBtn = document.getElementById('execute-btn');
            const executeBtnText = document.getElementById('execute-btn-text');
            const executeBtnSpinner = document.getElementById('execute-btn-spinner');
            const form = document.getElementById('execute-form');

            if (executeBtn) {
                executeBtn.disabled = isExecuting;
            }

            if (isExecuting) {
                // 実行中状態
                if (executeBtnText) {
                    executeBtnText.textContent = '実行中...';
                }
                if (executeBtnSpinner) {
                    executeBtnSpinner.style.display = 'inline';
                }
                // 全ての入力フィールドを無効化
                if (form) {
                    const inputFields = form.querySelectorAll('input, textarea, select, button');
                    inputFields.forEach(field => {
                        if (field !== executeBtn) {
                            field.disabled = true;
                        }
                    });
                }
            } else {
                // 通常状態
                if (executeBtnText) {
                    executeBtnText.textContent = '実行';
                }
                if (executeBtnSpinner) {
                    executeBtnSpinner.style.display = 'none';
                }
                // 全ての入力フィールドを再有効化
                if (form) {
                    const inputFields = form.querySelectorAll('input, textarea, select, button');
                    inputFields.forEach(field => {
                        if (field !== executeBtn) {
                            field.disabled = false;
                        }
                    });
                }
            }
        }

        async function editExecution(id) {
            try {
                const execution = await apiRequest(`/api/user/executions/${id}`);

                // 入力データを復元
                restoreInputData(execution);

                // 入力パネルにスクロール
                document.querySelector('.execute-input-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });

                showAlert('入力データを読み込みました。必要に応じて編集してから実行ボタンを押してください。', 'success');
            } catch (error) {
                showAlert('実行履歴の読み込みに失敗しました', 'error');
                console.error('Edit execution error:', error);
            }
        }

        function generateInputFields(inputSchema) {
            const container = document.getElementById('input-fields-container');

            if (!inputSchema || !inputSchema.properties || Object.keys(inputSchema.properties).length === 0) {
                // スキーマがない場合はシンプルなテキストエリア
                container.innerHTML = `
                    <div class="form-group">
                        <label for="input">入力</label>
                        <textarea id="input" name="input" rows="10" required></textarea>
                    </div>
                `;
                return;
            }

            // スキーマに基づいて入力フィールドを生成
            const properties = inputSchema.properties;
            const requiredFields = inputSchema.required || [];

            const fieldsHTML = Object.entries(properties).map(([fieldName, fieldConfig]) => {
                const label = fieldConfig.title || fieldName;
                const description = fieldConfig.description || '';
                const required = requiredFields.includes(fieldName) ? 'required' : '';
                const type = fieldConfig.type || 'string';
                const placeholder = description ? `placeholder="${description}"` : '';

                if (type === 'string' && description.includes('長文')) {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: rgba(255, 255, 255, 0.6);">${description}</small>` : ''}
                            <textarea id="${fieldName}" name="${fieldName}" rows="10" ${required} ${placeholder}></textarea>
                        </div>
                    `;
                } else if (type === 'string') {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: rgba(255, 255, 255, 0.6);">${description}</small>` : ''}
                            <textarea id="${fieldName}" name="${fieldName}" rows="5" ${required} ${placeholder}></textarea>
                        </div>
                    `;
                } else if (type === 'number' || type === 'integer') {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: rgba(255, 255, 255, 0.6);">${description}</small>` : ''}
                            <input type="number" id="${fieldName}" name="${fieldName}" ${required} ${placeholder}>
                        </div>
                    `;
                } else {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: rgba(255, 255, 255, 0.6);">${description}</small>` : ''}

                        </div>
                    `;
                }
            }).join('');

            container.innerHTML = fieldsHTML;
        }

        document.getElementById('execute-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const executeBtn = document.getElementById('execute-btn');
            const executeBtnText = document.getElementById('execute-btn-text');
            const executeBtnSpinner = document.getElementById('execute-btn-spinner');
            const form = e.target;

            // 入力データを収集（フィールドを無効化する前に収集する必要がある）
            const formData = new FormData(e.target);
            const inputData = {};
            for (const [key, value] of formData.entries()) {
                inputData[key] = value;
            }

            // 実行ボタンを無効化
            executeBtn.disabled = true;
            executeBtnText.textContent = '実行中...';

            // スピナーを表示
            if (executeBtnSpinner) {
                executeBtnSpinner.style.display = 'inline';
            }

            // 全ての入力フィールドを無効化
            const inputFields = form.querySelectorAll('input, textarea, select, button');
            inputFields.forEach(field => {
                if (field !== executeBtn) {
                    field.disabled = true;
                }
            });

            // 出力形式を取得（ファイル出力が許可されている場合）
            const outputFormat = document.getElementById('file-output-container').style.display === 'block'
                ? document.getElementById('output-format').value
                : 'txt';

            // 既に実行中の場合、キューに追加
            if (PersistentStatusBar.executionId) {
                // キューが満杯かチェック
                if (PersistentStatusBar.executionQueue.length >= PersistentStatusBar.MAX_QUEUE_SIZE) {
                    await Swal.fire({
                        title: 'キューが満杯です',
                        text: `最大${PersistentStatusBar.MAX_QUEUE_SIZE}つまで予約できます。現在の実行が完了するまでお待ちください。`,
                        icon: 'warning',
                        confirmButtonText: 'OK'
                    });
                    // ボタンを再有効化
                    executeBtn.disabled = false;
                    executeBtnText.textContent = '実行';
                    if (executeBtnSpinner) {
                        executeBtnSpinner.style.display = 'none';
                    }
                    inputFields.forEach(field => {
                        if (field !== executeBtn) {
                            field.disabled = false;
                        }
                    });
                    return;
                }

                // キューに追加
                const promptName = document.getElementById('prompt-name').textContent;
                PersistentStatusBar.addToQueue({
                    promptId: parseInt(promptId),
                    promptName: promptName,
                    inputData: inputData,
                    outputFormat: outputFormat !== 'txt' ? outputFormat : undefined
                });

                // ボタンを再有効化
                executeBtn.disabled = false;
                executeBtnText.textContent = '実行';
                if (executeBtnSpinner) {
                    executeBtnSpinner.style.display = 'none';
                }
                inputFields.forEach(field => {
                    if (field !== executeBtn) {
                        field.disabled = false;
                    }
                });
                return;
            }

            try {
                const initialResponse = await apiRequest('/api/execute', {
                    method: 'POST',
                    body: JSON.stringify({
                        prompt_id: parseInt(promptId),
                        input_data: inputData,
                        output_format: outputFormat !== 'txt' ? outputFormat : undefined
                    })
                });

                const executionId = initialResponse.execution_id;
                executeBtnText.textContent = '実行中...';

                // ドロップアニメーションとステータスバー開始
                const targetDock = document.getElementById('task-dock');

                if (targetDock) {
                    // アニメーション用パーティクルの生成
                    const startRect = executeBtn.getBoundingClientRect();
                    const targetRect = targetDock.getBoundingClientRect();

                    const particle = document.createElement('div');
                    Object.assign(particle.style, {
                        position: 'fixed',
                        width: '20px',
                        height: '20px',
                        backgroundColor: '#007bff',
                        borderRadius: '50%',
                        zIndex: '9999',
                        left: `${startRect.left + startRect.width / 2 - 10}px`,
                        top: `${startRect.top + startRect.height / 2 - 10}px`,
                        transition: 'all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55)',
                        boxShadow: '0 0 10px #007bff',
                        pointerEvents: 'none'
                    });

                    document.body.appendChild(particle);

                    // アニメーション開始（少し遅延させてDOM反映を待つ）
                    requestAnimationFrame(() => {
                        particle.style.left = `${targetRect.left + targetRect.width / 2 - 10}px`;
                        particle.style.top = `${targetRect.top + targetRect.height / 2 - 10}px`;
                        particle.style.transform = 'scale(0.5)';
                        particle.style.opacity = '0.5';
                    });

                    // アニメーション完了時の処理
                    setTimeout(() => {
                        if (document.body.contains(particle)) {
                            document.body.removeChild(particle);
                        }

                        // ターゲットのエフェクト（受け取った感）
                        targetDock.style.transform = 'scale(1.2)';
                        targetDock.style.background = 'rgba(0, 123, 255, 0.4)'; // 一瞬明るく

                        setTimeout(() => {
                            targetDock.style.transform = 'scale(1)';
                            // PersistentStatusBar.updateUIで背景色は上書きされるのでここでは戻さない
                        }, 200);

                        // ステータスバーを開始（ここでアイコンが青くなる）
                        const promptName = document.getElementById('prompt-name').textContent;
                        PersistentStatusBar.start(executionId, parseInt(promptId), promptName);
                    }, 600);
                } else {
                    // ターゲットが見つからない場合は即座に開始（フォールバック）
                    const promptName = document.getElementById('prompt-name').textContent;
                    PersistentStatusBar.start(executionId, parseInt(promptId), promptName);
                }

                // 2. 出力エリアを処理中表示に更新（スピナーなし）
                document.getElementById('output-content').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: rgba(255, 255, 255, 0.7);">
                        <p>AIが応答を生成しています...<br>この処理はバックグラウンドで実行されます。</p>
                        <div class="progress-bar-container" style="width: 100%; background-color: rgba(255,255,255,0.1); border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden;">
                            <div class="progress-bar" style="width: 0%; height: 100%; background-color: #007bff; transition: width 0.5s;"></div>
                        </div>
                    </div>
                `;

                // 3. 履歴テーブルに仮の行を追加（即時反映）
                const historyTableBody = document.querySelector('#history-container tbody');
                if (historyTableBody) {
                    const now = new Date();
                    const tempRow = document.createElement('tr');
                    tempRow.id = `exec-row-${executionId}`;
                    tempRow.className = 'highlight-new-row'; // CSSでアニメーションなどをつけると良い
                    tempRow.innerHTML = `
                        <td>${formatDate(now.toISOString())}</td>
                        <td>${document.getElementById('prompt-model').textContent.replace(/<[^>]*>/g, '')}</td>
                        <td>-</td>
                        <td>-</td>
                        <td><span style="color: orange;">pending</span> <div class="spinner" style="width: 12px; height: 12px; border-width: 1px; display: inline-block; vertical-align: middle;"></div></td>
                        <td>
                            <div class="actions">
                                <button disabled class="icon-btn" style="opacity: 0.5; cursor: not-allowed;">
                                    <svg clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px; fill: #ccc;"><path d="m11.239 15.533c-1.045 3.004-1.238 3.451-1.238 3.84 0 .441.385.627.627.627.272 0 1.108-.301 3.829-1.249zm.888-.888 3.22 3.22 6.408-6.401c.163-.163.245-.376.245-.591 0-.213-.082-.427-.245-.591-.58-.579-1.458-1.457-2.039-2.036-.163-.163-.377-.245-.591-.245-.213 0-.428.082-.592.245zm-3.127-.895c0-.402-.356-.75-.75-.75-2.561 0-2.939 0-5.5 0-.394 0-.75.348-.75.75s.356.75.75.75h5.5c.394 0 .75-.348.75-.75zm5-3c0-.402-.356-.75-.75-.75-2.561 0-7.939 0-10.5 0-.394 0-.75.348-.75.75s.356.75.75.75h10.5c.394 0 .75-.348.75-.75zm0-3c0-.402-.356-.75-.75-.75-2.561 0-7.939 0-10.5 0-.394 0-.75.348-.75.75s.356.75.75.75h10.5c.394 0 .75-.348.75-.75zm0-3c0-.402-.356-.75-.75-.75-2.561 0-7.939 0-10.5 0-.394 0-.75.348-.75.75s.356.75.75.75h10.5c.394 0 .75-.348.75-.75z" fill-rule="nonzero"/></svg>
                                </button>
                                <button onclick="showHistoryDetail(${executionId})" title="詳細" class="icon-btn" style="display: flex; align-items: center; justify-content: center; padding: 8px; background: none; border: none; cursor: pointer; transition: transform 0.2s ease, opacity 0.2s ease;">
                                    <svg clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px; fill: #17a2b8; transition: fill 0.2s ease, transform 0.2s ease;"><path d="m15 17.75c0-.414-.336-.75-.75-.75h-11.5c-.414 0-.75.336-.75.75s.336.75.75.75h11.5c.414 0 .75-.336.75-.75zm7-4c0-.414-.336-.75-.75-.75h-18.5c-.414 0-.75.336-.75.75s.336.75.75.75h18.5c.414 0 .75-.336.75-.75zm0-4c0-.414-.336-.75-.75-.75h-18.5c-.414 0-.75.336-.75.75s.336.75.75.75h18.5c.414 0 .75-.336.75-.75zm0-4c0-.414-.336-.75-.75-.75h-18.5c-.414 0-.75.336-.75.75s.336.75.75.75h18.5c.414 0 .75-.336.75-.75z" fill-rule="nonzero"/></svg>
                                </button>
                            </div>
                        </td>
                    `;
                    historyTableBody.insertBefore(tempRow, historyTableBody.firstChild);

                    // 3件以上なら最後を削除
                    if (historyTableBody.children.length > displayedHistoryCount) {
                        historyTableBody.removeChild(historyTableBody.lastChild);
                    }
                }

                // ポーリング開始
                const pollInterval = 2000; // 2秒ごとに確認
                let pollCount = 0;
                const maxPolls = 300; // 最大10分 (2s * 300)
                let pollIntervalId = null;

                // ページ離脱時のクリーンアップ
                const cleanupPolling = () => {
                    if (pollIntervalId) {
                        clearInterval(pollIntervalId);
                        pollIntervalId = null;
                    }
                };
                window.addEventListener('beforeunload', cleanupPolling);
                // グローバルスコープにも保存して、stopExecutionからアクセスできるようにする
                window.pollIntervalId = pollIntervalId;
                window.cleanupPolling = cleanupPolling;

                const pollResult = await new Promise((resolve, reject) => {
                    pollIntervalId = setInterval(async () => {
                        try {
                            pollCount++;

                            // プログレスバーの更新 (90%まで進める)
                            const progressBar = document.querySelector('.progress-bar');
                            if (progressBar) {
                                const currentWidth = parseFloat(progressBar.style.width) || 0;
                                if (currentWidth < 90) {
                                    progressBar.style.width = `${currentWidth + (90 - currentWidth) * 0.1}%`;
                                }
                            }

                            if (pollCount > maxPolls) {
                                cleanupPolling();
                                reject(new Error('タイムアウトしました'));
                                return;
                            }

                            const execution = await apiRequest(`/api/user/executions/${executionId}`);

                            // 実行状態を先に確認（完了、エラー、キャンセルの場合は処理を続行）
                            if (execution.status === 'success' || execution.status === 'error' || execution.status === 'cancelled') {
                                // 完了状態の場合は、PersistentStatusBar.executionIdのチェックをスキップ
                            } else if (!PersistentStatusBar.executionId || PersistentStatusBar.executionId !== executionId) {
                                // 実行中の場合のみ、PersistentStatusBar.executionIdのチェックを行う
                                cleanupPolling();
                                reject(new Error('キャンセルされました'));
                                return;
                            }

                            if (execution.status === 'success') {
                                cleanupPolling();
                                // 完了時は100%にする
                                if (progressBar) progressBar.style.width = '100%';
                                // 完了状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('success');
                                }
                                // カスタムイベントを発火（他のページから戻ってきた時などに結果を表示するため）
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                resolve(execution);
                            } else if (execution.status === 'error') {
                                cleanupPolling();
                                // エラー状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('error');
                                }
                                reject(new Error(execution.error_message || '実行エラーが発生しました'));
                            } else if (execution.status === 'cancelled') {
                                cleanupPolling();
                                // キャンセル状態をDockに表示（履歴として残す）
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('cancelled');
                                }
                                reject(new Error('実行がキャンセルされました'));
                            }
                            // pending または processing の場合は継続
                        } catch (err) {
                            if (err.message !== 'キャンセルされました') {
                                cleanupPolling();
                                PersistentStatusBar.stop();
                                reject(err);
                            }
                        }
                    }, pollInterval);
                });

                // クリーンアップ
                window.removeEventListener('beforeunload', cleanupPolling);

                const result = pollResult;

                // 入力データを入力フィールドに復元
                restoreInputData(result);

                // 結果を表示（関数を使用）
                displayExecutionResult(result, executionId, outputFormat);

                // 出力パネルを確実に表示
                const outputPanel = document.querySelector('.execute-output-panel');
                if (outputPanel) {
                    outputPanel.style.display = 'flex';
                    outputPanel.style.visibility = 'visible';
                }

                // ファイル出力結果の表示
                // 注: バックグラウンド処理ではファイル出力はまだ実装されていないため、
                // 必要であれば別途ダウンロードAPIを叩くなどの実装が必要ですが、
                // 今回はテキスト出力のみ確認します。
                // 元のコードではレスポンスにfile_outputが含まれていましたが、
                // バックグラウンド処理後のExecutionモデルにはfile_outputは保存されていません（DB設計上）。
                // そのため、ファイルダウンロードボタンを表示するには、
                // /api/execute/download/{execution_id} へのリンクを表示する必要があります。

                const fileOutputDiv = document.getElementById('file-output-result');
                if (outputFormat !== 'txt') {
                    const downloadLink = document.createElement('a');
                    // download APIを使用
                    downloadLink.href = `/api/execute/download/${executionId}?output_format=${outputFormat}`;
                    downloadLink.className = 'btn btn-success';
                    downloadLink.textContent = `結果をダウンロード (${outputFormat.toUpperCase()})`;
                    downloadLink.style.marginTop = '10px';
                    downloadLink.style.display = 'inline-block';
                    // 認証トークンが必要なため、直接リンクではなくfetchで取得してblobにするか、
                    // あるいはCookie認証などが効いている前提かによりますが、
                    // 既存のdownload_execution_fileはGETでトークンをHeaderに必要とするため、
                    // 単純なhrefでは難しい可能性があります。
                    // ここでは既存の仕組みに合わせて、ダウンロードボタンをクリックしたら
                    // fetchで取得してダウンロードする関数を呼び出すようにします。

                    downloadLink.href = "#";
                    downloadLink.onclick = async (e) => {
                        e.preventDefault();
                        try {
                            const response = await fetch(`/api/execute/download/${executionId}?output_format=${outputFormat}`, {
                                headers: {
                                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                                }
                            });
                            if (!response.ok) throw new Error('Download failed');

                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `execution_${executionId}.${outputFormat}`; // 簡易的なファイル名
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);
                            document.body.removeChild(a);
                        } catch (err) {
                            showAlert('ダウンロードに失敗しました', 'error');
                        }
                    };

                    if (fileOutputDiv) {
                        fileOutputDiv.innerHTML = '';
                        fileOutputDiv.appendChild(downloadLink);
                        fileOutputDiv.style.display = 'block';
                    }
                } else {
                    if (fileOutputDiv) {
                        fileOutputDiv.style.display = 'none';
                    }
                }

                await Swal.fire({
                    title: '実行完了',
                    text: '実行が完了しました',
                    icon: 'success',
                    confirmButtonText: 'OK'
                });

                // 実行履歴を再読み込み
                loadHistory();
            } catch (error) {
                // クリーンアップ（エラー時も）
                if (typeof cleanupPolling === 'function') {
                    cleanupPolling();
                    window.removeEventListener('beforeunload', cleanupPolling);
                }

                // キャンセルされた場合は特別な処理
                if (error.message === 'キャンセルされました' || error.message === '実行がキャンセルされました') {
                    document.getElementById('output-content').innerHTML = '<div style="color: #ffc107; text-align: center; padding: 20px;">実行がキャンセルされました</div>';
                } else {
                    await Swal.fire({
                        title: '実行エラー',
                        text: '実行に失敗しました: ' + error.message,
                        icon: 'error',
                        confirmButtonText: 'OK'
                    });
                    document.getElementById('output-content').innerHTML = `<div style="color: #dc3545; text-align: center; padding: 20px;">エラー: ${error.message.trim()}</div>`;
                }
                console.error('Execute error:', error);
            } finally {
                // 実行ボタンを再有効化
                executeBtn.disabled = false;
                executeBtnText.textContent = '実行';

                // スピナーを非表示
                if (executeBtnSpinner) {
                    executeBtnSpinner.style.display = 'none';
                }

                // 全ての入力フィールドを再有効化
                inputFields.forEach(field => {
                    if (field !== executeBtn) {
                        field.disabled = false;
                    }
                });
            }
        });

        // 出力をコピーする関数
        async function copyOutput() {
            const outputContent = document.getElementById('output-content');
            const text = outputContent.textContent || outputContent.innerText;

            if (!text || text === '実行ボタンを押すと結果がここに表示されます') {
                showAlert('コピーする内容がありません', 'warning');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showAlert('出力をクリップボードにコピーしました', 'success');

                // ボタンの視覚的フィードバック
                const copyBtn = document.getElementById('copy-output-btn');
                const originalOpacity = copyBtn.style.opacity;
                copyBtn.style.opacity = '1';
                setTimeout(() => {
                    copyBtn.style.opacity = originalOpacity;
                }, 500);
            } catch (error) {
                // フォールバック: テキストエリアを使用
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showAlert('出力をクリップボードにコピーしました', 'success');
                } catch (err) {
                    showAlert('コピーに失敗しました', 'error');
                }
                document.body.removeChild(textarea);
            }
        }

        // 実行キャンセルイベントのリスナー
        window.addEventListener('executionCancelled', async (event) => {
            const { executionId } = event.detail;
            if (!executionId) return;

            // ポーリングを停止
            if (typeof cleanupPolling === 'function') {
                cleanupPolling();
                window.removeEventListener('beforeunload', cleanupPolling);
            }

            // 実行データを取得して入力データを復元（出力は復元しない）
            try {
                const execution = await apiRequest(`/api/user/executions/${executionId}`);
                // 入力データを復元
                restoreInputData(execution);
            } catch (error) {
                console.error('Failed to restore cancelled execution data:', error);
            }

            // 実行ボタンの状態をリセット
            setExecutionButtonState(false);

            // 出力エリアにキャンセルメッセージを表示（出力は復元しない）
            const outputContent = document.getElementById('output-content');
            if (outputContent) {
                outputContent.innerHTML = '<div style="color: #ffc107; text-align: center; padding: 20px; font-weight: 500;">実行がキャンセルされました</div>';

            if (outputPanel) {
                outputPanel.style.display = 'flex';

        // 実行完了イベントのリスナー（他のページから戻ってきた時や、ページ読み込み後に完了した場合）
        window.addEventListener('executionCompleted', async (event) => {
            const { execution, executionId } = event.detail;
            if (!execution || !executionId) return;

            // 現在のプロンプトIDと一致するか確認
            const currentPromptId = parseInt(promptId);
            if (execution.prompt_id !== currentPromptId) return;

            // 既に処理済みかチェック（重複実行を防ぐ）
            if (execution.status === 'success') {
                // 入力データを復元
                restoreInputData(execution);

                // 実行ボタンを再有効化（完了したので）
                setExecutionButtonState(false);

                // 結果を表示
                displayExecutionResult(execution, executionId, null);

                // 実行履歴を再読み込み
                loadHistory();
            } else if (execution.status === 'error' || execution.status === 'cancelled') {
                // エラーまたはキャンセル済み
                restoreInputData(execution);

                setExecutionButtonState(false);

                displayExecutionError(execution);
                loadHistory();

        // キューからタスクを実行する関数（グローバルスコープに公開）
        window.executeQueuedTask = async function(taskData) {
            try {
                const initialResponse = await apiRequest('/api/execute', {
                    method: 'POST',
                    body: JSON.stringify({
                        prompt_id: parseInt(taskData.promptId),
                        input_data: taskData.inputData,
                        output_format: taskData.outputFormat !== 'txt' ? taskData.outputFormat : undefined
                    })
                });

                const executionId = initialResponse.execution_id;
                const promptName = taskData.promptName || document.getElementById('prompt-name')?.textContent || '実行中...';

                // ステータスバーを開始
                PersistentStatusBar.start(executionId, parseInt(taskData.promptId), promptName);

                // 出力エリアを処理中表示に更新
                document.getElementById('output-content').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: rgba(255, 255, 255, 0.7);">
                        <p>AIが応答を生成しています...<br>この処理はバックグラウンドで実行されます。</p>
                        <div class="progress-bar-container" style="width: 100%; background-color: rgba(255,255,255,0.1); border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden;">
                            <div class="progress-bar" style="width: 0%; height: 100%; background-color: #007bff; transition: width 0.5s;"></div>
                        </div>
                    </div>
                `;

                // ポーリング開始（resumePollingと同じロジック）
                const pollInterval = 2000;
                let pollCount = 0;
                const maxPolls = 300;
                let pollIntervalId = null;

                const cleanupPolling = () => {
                    if (pollIntervalId) {
                        clearInterval(pollIntervalId);
                        pollIntervalId = null;
                    }
                };
                window.addEventListener('beforeunload', cleanupPolling);

                const pollResult = await new Promise((resolve, reject) => {
                    pollIntervalId = setInterval(async () => {
                        try {
                            pollCount++;

                            const progressBar = document.querySelector('.progress-bar');
                            if (progressBar) {
                                const currentWidth = parseFloat(progressBar.style.width) || 0;
                                if (currentWidth < 90) {
                                    progressBar.style.width = `${currentWidth + (90 - currentWidth) * 0.1}%`;
                                }
                            }

                            if (pollCount > maxPolls) {
                                cleanupPolling();
                                reject(new Error('タイムアウトしました'));
                                return;
                            }

                            const execution = await apiRequest(`/api/user/executions/${executionId}`);

                            if (execution.status === 'success' || execution.status === 'error' || execution.status === 'cancelled') {
                                // 完了状態の場合は、PersistentStatusBar.executionIdのチェックをスキップ
                            } else if (!PersistentStatusBar.executionId || PersistentStatusBar.executionId !== executionId) {
                                cleanupPolling();
                                reject(new Error('キャンセルされました'));
                                return;
                            }

                            if (execution.status === 'success') {
                                cleanupPolling();
                                if (progressBar) progressBar.style.width = '100%';
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('success');
                                }
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                resolve(execution);
                            } else if (execution.status === 'error') {
                                cleanupPolling();
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('error');
                                }
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                reject(new Error(execution.error_message || '実行エラーが発生しました'));
                            } else if (execution.status === 'cancelled') {
                                cleanupPolling();
                                if (PersistentStatusBar.executionId === executionId) {
                                    PersistentStatusBar.markAsCompleted('cancelled');
                                }
                                window.dispatchEvent(new CustomEvent('executionCompleted', {
                                    detail: { execution, executionId }
                                }));
                                reject(new Error('実行がキャンセルされました'));
                            }
                        } catch (err) {
                            if (err.message !== 'キャンセルされました') {
                                cleanupPolling();
                                PersistentStatusBar.stop();
                                reject(err);
                            }
                        }
                    }, pollInterval);
                });

                window.removeEventListener('beforeunload', cleanupPolling);

                restoreInputData(pollResult);
                setExecutionButtonState(false);
                displayExecutionResult(pollResult, executionId, taskData.outputFormat);

                const outputPanel = document.querySelector('.execute-output-panel');
                if (outputPanel) {
                    outputPanel.style.display = 'flex';
                    outputPanel.style.visibility = 'visible';
                }

                loadHistory();
            } catch (error) {
                console.error('Queued task execution error:', error);
                setExecutionButtonState(false);
                if (error.message === 'キャンセルされました' || error.message === '実行がキャンセルされました') {
                    displayExecutionError({ status: 'cancelled', error_message: error.message });
                } else {
                    displayExecutionError({ status: 'error', error_message: error.message });
                }
                loadHistory();
            }
        };

        // URLパラメータを取得する関数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ページ読み込み時に実行
        (async () => {
            await checkAuth();
            loadPromptDetail();

            // localStorageにpending_queue_taskがある場合、キューからタスクを実行
            const pendingTaskData = localStorage.getItem('pending_queue_task');
            if (pendingTaskData) {
                try {
                    const taskData = JSON.parse(pendingTaskData);
                    // localStorageから削除
                    localStorage.removeItem('pending_queue_task');
                    // キューからタスクを実行
                    await window.executeQueuedTask(taskData);
                } catch (error) {
                    console.error('Failed to execute queued task:', error);
                    // エラー時もlocalStorageから削除
                    localStorage.removeItem('pending_queue_task');
                }
            }
        })();
    </script>
</body>
</html>
