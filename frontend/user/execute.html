<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スキル実行 - NexMAGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">スキル実行</h1>
            </div>
            <div class="nav" id="desktop-nav"></div>

            <!-- スキル名 + 説明（切り抜きカード + 戻るボタン） -->
            <div class="card-cutout-wrapper" style="margin-bottom: 16px;">
                <div class="card-cutout" style="padding: 20px 24px;">
                    <h2 id="skill-name">-</h2>
                    <p id="skill-description" style="margin: 4px 0 0; color: var(--content-text-secondary); font-size: 13px;">-</p>
                    <p style="margin: 6px 0 0; font-size: 12px; color: var(--content-text-muted);"><strong>モデル:</strong> <span id="skill-model">-</span></p>
                </div>
                <div class="card-cutout-circle" onclick="window.NexMAGIRuntime.navigate('dashboard.html')" title="ワークフロー / スキル管理に戻る">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                </div>
            </div>

            <!-- 入力 + 出力 -->
            <div class="wf-io-panels" style="border-top: none; padding-top: 0;">
                <!-- 入力（切り抜き + 実行ボタン円） -->
                <div class="card-cutout-wrapper">
                    <div class="card-cutout wf-io-panel wf-io-input">
                        <div class="wf-io-panel-header">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            入力
                        </div>
                        <form id="execute-form">
                            <div id="input-fields-container">
                                <!-- 動的に生成される入力フィールド -->
                            </div>

                            <div id="file-output-container" style="display: none;">
                                <div class="form-group" style="margin-top: 12px;">
                                    <label for="output-format">出力形式</label>
                                    <select id="output-format">
                                        <option value="txt">テキスト (TXT)</option>
                                        <option value="csv">CSV</option>
                                        <option value="pdf">PDF</option>
                                        <option value="docx">Word (DOCX)</option>
                                        <option value="md">Markdown (MD)</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" id="execute-btn" style="display:none;">
                                <span id="execute-btn-text">実行</span>
                                <span id="execute-btn-spinner" style="display: none;">
                                    <div class="wf-dots-loader"><span></span><span></span><span></span></div>
                                </span>
                            </button>
                        </form>
                    </div>
                    <div class="card-cutout-circle" onclick="document.getElementById('execute-btn').click()" title="スキル実行" id="skill-execute-circle" style="font-size:12px; font-weight:700; color:#fff;">
                        <span id="skill-exec-icon" style="color:#fff !important;">実行</span>
                        <div id="skill-exec-spinner" style="display:none;"><div class="wf-dots-loader"><span></span><span></span><span></span></div></div>
                    </div>
                </div>

                <!-- 出力（切り抜き + コピーボタン円） -->
                <div class="card-cutout-wrapper">
                    <div class="card-cutout wf-io-panel wf-io-output">
                        <div class="wf-io-panel-header">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            出力
                        </div>
                        <div id="output-content" class="wf-io-output-content wf-flow-placeholder">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                            <span>実行すると結果がここに表示されます</span>
                        </div>
                        <div id="file-output-result" style="display: none;"></div>
                        <div class="skill-exec-stats" id="skill-exec-stats" style="display:none;">
                            <span><strong>モデル:</strong> <span id="stat-model">-</span></span>
                            <span><strong>実行時間:</strong> <span id="stat-time">-</span></span>
                            <span><strong>トークン:</strong> <span id="stat-tokens">-</span></span>
                        </div>
                    </div>
                    <div class="card-cutout-circle" onclick="copyOutput()" title="出力をコピー">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </div>
                </div>
            </div>

            <!-- 下部: 実行履歴（折りたたみ式） -->
            <div class="wf-history-section" style="margin-top: 20px;">
                <details class="wf-history-details">
                    <summary class="wf-history-summary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        実行履歴
                    </summary>
                    <div class="wf-history-scroll">
                        <table class="table wf-history-table">
                            <thead>
                                <tr>
                                    <th>実行日時</th>
                                    <th>モデル</th>
                                    <th>出力形式</th>
                                    <th>実行時間</th>
                                    <th>トークン数</th>
                                    <th>ステータス</th>
                                    <th>アクション</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody">
                                <tr>
                                    <td colspan="7" style="text-align: center;">読み込み中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        window.__NEXMAGI_RUNTIME = window.__NEXMAGI_RUNTIME || {
            desktop: true,
            apiBase: 'http://127.0.0.1:8000',
            workerScriptPath: 'js/execution-worker.js'
        };
    </script>
    <script src="../js/runtime-adapter.js"></script>
    <script src="../js/swal-defaults.js"></script>
    <script src="../js/mini-cube.js"></script>
    <script src="../js/model-display.js"></script>
    <script src="../js/exec-detail-modal.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/execute.js"></script>
</body>
</html>
