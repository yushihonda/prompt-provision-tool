<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロンプト実行 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ プロンプト実行</h1>
            <div class="user-info">
                <span id="username-display">-</span>
                <button class="btn-logout" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="content">
            <div class="nav">
                <button class="nav-item" onclick="location.href='dashboard.html'">プロンプト一覧</button>
                <button class="nav-item" onclick="location.href='history.html'">実行履歴</button>
            </div>

            <div id="alert-container"></div>

            <div class="card">
                <h2 id="prompt-name">-</h2>
                <p id="prompt-description">-</p>
                <p><strong>モデル:</strong> <span id="prompt-model">-</span></p>
            </div>

            <form id="execute-form">
                <div id="input-fields-container">
                    <!-- 動的に生成される入力フィールド -->
                </div>

                <button type="submit" class="btn btn-primary" id="execute-btn">実行</button>
            </form>

            <div id="result-container" style="display: none;">
                <h3>実行結果</h3>
                <div class="output-box" id="output-content"></div>
                <div class="stats">
                    <div class="stat-item">
                        <label>使用モデル</label>
                        <value id="stat-model">-</value>
                    </div>
                    <div class="stat-item">
                        <label>実行時間</label>
                        <value id="stat-time">-</value>
                    </div>
                    <div class="stat-item">
                        <label>トークン数</label>
                        <value id="stat-tokens">-</value>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/user-common.js"></script>
    <script>
        let promptId = null;
        let promptDetail = null;

        async function loadPromptDetail() {
            promptId = getQueryParam('id');
            if (!promptId) {
                showAlert('プロンプトIDが指定されていません', 'error');
                return;
            }

            try {
                promptDetail = await apiRequest(`/api/user/prompts/${promptId}`);
                
                // プロンプト情報を表示
                document.getElementById('prompt-name').textContent = promptDetail.name;
                document.getElementById('prompt-description').textContent = promptDetail.description || '説明なし';
                document.getElementById('prompt-model').textContent = promptDetail.model_type;
                
                // 入力フィールドを生成
                generateInputFields(promptDetail.input_schema);
            } catch (error) {
                showAlert('プロンプト情報の読み込みに失敗しました', 'error');
                console.error('Load prompt detail error:', error);
            }
        }

        function generateInputFields(inputSchema) {
            const container = document.getElementById('input-fields-container');
            
            if (!inputSchema || !inputSchema.properties || Object.keys(inputSchema.properties).length === 0) {
                // スキーマがない場合はシンプルなテキストエリア
                container.innerHTML = `
                    <div class="form-group">
                        <label for="input">入力</label>
                        <textarea id="input" name="input" rows="10" required></textarea>
                    </div>
                `;
                return;
            }
            
            // スキーマに基づいて入力フィールドを生成
            const properties = inputSchema.properties;
            const requiredFields = inputSchema.required || [];
            
            const fieldsHTML = Object.entries(properties).map(([fieldName, fieldConfig]) => {
                const label = fieldConfig.title || fieldName;
                const description = fieldConfig.description || '';
                const required = requiredFields.includes(fieldName) ? 'required' : '';
                const type = fieldConfig.type || 'string';
                const placeholder = description ? `placeholder="${description}"` : '';
                
                if (type === 'string' && description.includes('長文')) {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: #666;">${description}</small>` : ''}
                            <textarea id="${fieldName}" name="${fieldName}" rows="10" ${required} ${placeholder}></textarea>
                        </div>
                    `;
                } else if (type === 'string') {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: #666;">${description}</small>` : ''}
                            <textarea id="${fieldName}" name="${fieldName}" rows="5" ${required} ${placeholder}></textarea>
                        </div>
                    `;
                } else if (type === 'number' || type === 'integer') {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: #666;">${description}</small>` : ''}
                            <input type="number" id="${fieldName}" name="${fieldName}" ${required} ${placeholder}>
                        </div>
                    `;
                } else {
                    return `
                        <div class="form-group">
                            <label for="${fieldName}">${label}</label>
                            ${description ? `<small style="color: #666;">${description}</small>` : ''}
                            <input type="text" id="${fieldName}" name="${fieldName}" ${required} ${placeholder}>
                        </div>
                    `;
                }
            }).join('');
            
            container.innerHTML = fieldsHTML;
        }

        document.getElementById('execute-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const executeBtn = document.getElementById('execute-btn');
            executeBtn.disabled = true;
            executeBtn.textContent = '実行中...';
            
            // 入力データを収集
            const formData = new FormData(e.target);
            const inputData = {};
            for (const [key, value] of formData.entries()) {
                inputData[key] = value;
            }
            
            try {
                const result = await apiRequest('/api/execute', {
                    method: 'POST',
                    body: JSON.stringify({
                        prompt_id: parseInt(promptId),
                        input_data: inputData
                    })
                });
                
                // 結果を表示
                document.getElementById('output-content').textContent = result.output;
                document.getElementById('stat-model').textContent = result.model_used;
                document.getElementById('stat-time').textContent = `${result.execution_time}ms`;
                document.getElementById('stat-tokens').textContent = result.tokens_used || '-';
                
                document.getElementById('result-container').style.display = 'block';
                
                showAlert('実行が完了しました', 'success');
            } catch (error) {
                showAlert('実行に失敗しました: ' + error.message, 'error');
                console.error('Execute error:', error);
            } finally {
                executeBtn.disabled = false;
                executeBtn.textContent = '実行';
            }
        });

        // ページ読み込み時に実行
        checkAuth();
        loadPromptDetail();
    </script>
</body>
</html>
