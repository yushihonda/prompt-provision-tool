<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワークフロー実行 - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme">
    <div class="container">
        <div class="content">
            <div class="page-title-container">
                <h1 class="page-title">ワークフロー実行</h1>
            </div>
            <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
                <div id="desktop-nav" style="display: flex; gap: 10px;"></div>
                <button class="btn btn-secondary" onclick="location.href='dashboard.html'" style="display: inline-flex; align-items: center; gap: 5px; padding: 10px 20px;">
                    ← ワークフロー / スキル管理に戻る
                </button>
            </div>

            <div class="card">
                <h2 id="workflow-name">-</h2>
                <p id="workflow-description">-</p>
            </div>

            <!-- 常時ステータスバー -->
            <div id="wf-status-bar" style="display:none; position:sticky; top:0; z-index:100; margin-bottom:12px; padding:10px 16px; background:rgba(20,20,30,0.95); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:8px;"></div>

            <div class="execute-layout">
                <div class="execute-input-panel">
                    <h3>入力</h3>
                    <form id="workflow-execute-form">
                        <div id="workflow-input-fields-container">
                            <!-- ワークフロー/Skill用の入力フィールドを動的生成 -->
                        </div>

                        <div class="form-group" style="margin-top: 12px;">
                            <label for="workflow-output-format">出力形式</label>
                            <select id="workflow-output-format">
                                <option value="txt">テキスト (TXT)</option>
                                <option value="csv">CSV</option>
                                <option value="pdf">PDF</option>
                                <option value="docx">Word (DOCX)</option>
                                <option value="md">Markdown (MD)</option>
                            </select>
                            <small style="color: rgba(255, 255, 255, 0.6);">各ステップの出力形式（現状はメタ情報としてのみ利用）</small>
                        </div>

                        <div style="margin-top: 8px; padding: 8px 12px; background: rgba(40, 167, 69, 0.08); border: 1px solid rgba(40, 167, 69, 0.2); border-radius: 6px; font-size: 11px; color: rgba(255,255,255,0.6);">
                            ローカルワーカーで実行されます。ターミナルで <code style="background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:3px; cursor:pointer;" onclick="navigator.clipboard.writeText('python -m local_worker daemon')" title="コピー">python -m local_worker daemon</code> を起動してください。
                        </div>

                        <button type="submit" class="btn btn-primary" id="workflow-execute-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px;">
                            <span id="workflow-execute-btn-text">ワークフロー実行</span>
                            <span id="workflow-execute-btn-spinner" style="display: none;">
                                <div class="spinner" style="display: inline-block; width: 16px; height: 16px; border-width: 2px; vertical-align: middle;"></div>
                            </span>
                        </button>
                    </form>
                </div>

                <div class="execute-output-panel">
                    <h3>実行フロー</h3>
                    <div style="flex:1; overflow-y:auto; min-height:0;">
                        <!-- 実行フロー表示 -->
                        <div id="workflow-flow-view" style="display:none;"></div>

                        <!-- ステップ結果 -->
                        <div id="workflow-result-container">
                            <div class="output-box" id="workflow-output-content">ワークフローを実行すると、各ステップの実行結果がここに表示されます</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 実行履歴セクション -->
            <div class="card" style="margin-top: 20px;">
                <h3 style="margin-bottom: 20px;">実行履歴</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>実行日時</th>
                            <th>ステップ</th>
                            <th>実行時間</th>
                            <th>トークン数</th>
                            <th>ステータス</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/model-display.js"></script>
    <script src="../js/exec-detail-modal.js"></script>
    <script src="js/user-common.js"></script>
    <script src="js/workflow-execute.js"></script>
</body>
</html>
