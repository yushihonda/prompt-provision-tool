<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザーログイン - Prompt Provision Tool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="user-theme login-page">
    <div class="login-container">
        <h1>ログイン</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">ログイン</button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // 前回の認証エラーを確認
        window.addEventListener('DOMContentLoaded', () => {
            const authError = localStorage.getItem('auth_error');
            if (authError) {
                try {
                    const error = JSON.parse(authError);
                    // エラーをアラートで表示
                    Swal.fire({
                        title: '認証エラー',
                        html: `
                            <p><strong>エラータイプ:</strong> ${error.type}</p>
                            <p><strong>メッセージ:</strong> ${error.message || '不明なエラー'}</p>
                            ${error.status ? `<p><strong>ステータス:</strong> ${error.status}</p>` : ''}
                            ${error.response ? `<p><strong>レスポンス:</strong> ${error.response.substring(0, 200)}</p>` : ''}
                            <p><strong>時刻:</strong> ${new Date(error.timestamp).toLocaleString('ja-JP')}</p>
                            <details style="margin-top: 10px;">
                                <summary>詳細ログ（クリックで展開）</summary>
                                <pre style="text-align: left; font-size: 10px; max-height: 200px; overflow: auto;">${JSON.stringify(error, null, 2)}</pre>
                            </details>
                        `,
                        icon: 'error',
                        width: '600px',
                        confirmButtonText: 'OK'
                    });
                    // エラー情報をクリア
                    localStorage.removeItem('auth_error');
                } catch (e) {
                    // エラー情報のパースに失敗した場合は無視
                }
            }
        });

        // リロード時はリダイレクトしない（セッション管理）

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    body: formData
                });

                // レスポンスのContent-Typeをチェック
                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    // JSONでない場合はテキストとして取得
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    throw new Error(`サーバーエラー (${response.status}): JSONレスポンスが期待されましたが、テキストが返されました`);
                }

                if (response.ok) {
                    // JWTトークンをデコードしてアカウントタイプを確認
                    const tokenParts = data.access_token.split('.');
                    if (tokenParts.length === 3) {
                        try {
                            const payload = JSON.parse(atob(tokenParts[1]));
                            const accountType = payload.type;

                            // ユーザーログイン画面ではCHILDアカウントのみ許可
                            if (accountType !== 'CHILD') {
                                showAlert('このアカウントはユーザーアカウントではありません。管理者ログイン画面をご利用ください。', 'error');
                                return;
                            }
                        } catch (e) {
                            console.error('Token decode error:', e);
                        }
                    }

                    // トークンをセッションストレージに保存
                    sessionStorage.setItem('token', data.access_token);
                    sessionStorage.setItem('username', username);

                    // ダッシュボードへリダイレクト
                    window.location.href = 'dashboard.html';
                } else {
                    showAlert(data.detail || 'ログインに失敗しました', 'error');
                }
            } catch (error) {
                showAlert(`サーバーとの通信に失敗しました: ${error.message}`, 'error');
                console.error('Login error:', error);
            }
        });

        async function showAlert(message, type) {
            // typeをSweetAlertのiconにマッピング
            let icon = 'info';
            if (type === 'success') icon = 'success';
            else if (type === 'error') icon = 'error';
            else if (type === 'warning') icon = 'warning';
            else icon = 'info';

            await Swal.fire({
                title: icon === 'error' ? 'エラー' : icon === 'success' ? '成功' : icon === 'warning' ? '警告' : '情報',
                text: message,
                icon: icon,
                confirmButtonText: 'OK',
                timer: 3000,
                timerProgressBar: true
            });
        }
    </script>
</body>
</html>
